Name: luckydraw-api
Host: 0.0.0.0
Port: ${LUCKYDRAW_API_PORT}
Mode: ${SERVICE_MODE}
Debug: ${SERVICE_DEBUG}

Log:
  ServiceName: luckydraw-api
  Level: error

RootDir: ./

#静态资源服务配置
StaticConfig:
  Domain: ${STATIC_HOST}
  Root: ${STATIC_ROOT}

#监控
Prometheus:
  Host: 0.0.0.0
  Port: ${PROMETHEUS_LUCKYDRAW_API_PORT}
  Path: /metrics

#链路追踪
Telemetry:
  Name: luckdarw-api
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Auth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400

CaptchaRpc:
  Endpoints:
    - 127.0.0.1:${CAPTCHA_RPC_PORT}
  NonBlock: true
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: captcha.rpc

LuckydrawRpc:
  Endpoints:
    - 127.0.0.1:${LUCKYDRAW_RPC_PORT}
  NonBlock: true
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: luckydraw.rpc
