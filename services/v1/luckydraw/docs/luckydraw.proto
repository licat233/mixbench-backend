service Base {

  // Activity rpc

  //添加活动
  rpc AddActivity(AddActivityReq) returns (AddActivityResp);
  //更新活动
  rpc PutActivity(PutActivityReq) returns (PutActivityResp);
  //获取活动
  rpc GetActivity(GetActivityReq) returns (GetActivityResp);
  //删除活动
  rpc DelActivity(DelActivityReq) returns (DelActivityResp);
  //获取活动列表
  rpc GetActivityList(GetActivityListReq) returns (GetActivityListResp);
  //获取活动枚举列表
  rpc GetActivityEnums(GetActivityEnumsReq) returns (Enums);

  // Lucky rpc

  //添加中奖名单
  rpc AddLucky(AddLuckyReq) returns (AddLuckyResp);
  //更新中奖名单
  rpc PutLucky(PutLuckyReq) returns (PutLuckyResp);
  //获取中奖名单
  rpc GetLucky(GetLuckyReq) returns (GetLuckyResp);
  //删除中奖名单
  rpc DelLucky(DelLuckyReq) returns (DelLuckyResp);
  //获取中奖名单列表
  rpc GetLuckyList(GetLuckyListReq) returns (GetLuckyListResp);
  //获取中奖名单枚举列表
  rpc GetLuckyEnums(GetLuckyEnumsReq) returns (Enums);

  // Prize rpc

  //添加奖品名单
  rpc AddPrize(AddPrizeReq) returns (AddPrizeResp);
  //更新奖品名单
  rpc PutPrize(PutPrizeReq) returns (PutPrizeResp);
  //获取奖品名单
  rpc GetPrize(GetPrizeReq) returns (GetPrizeResp);
  //删除奖品名单
  rpc DelPrize(DelPrizeReq) returns (DelPrizeResp);
  //获取奖品名单列表
  rpc GetPrizeList(GetPrizeListReq) returns (GetPrizeListResp);
  //获取奖品名单枚举列表
  rpc GetPrizeEnums(GetPrizeEnumsReq) returns (Enums);

  // PrizeGrade rpc

  //添加奖品级别
  rpc AddPrizeGrade(AddPrizeGradeReq) returns (AddPrizeGradeResp);
  //更新奖品级别
  rpc PutPrizeGrade(PutPrizeGradeReq) returns (PutPrizeGradeResp);
  //获取奖品级别
  rpc GetPrizeGrade(GetPrizeGradeReq) returns (GetPrizeGradeResp);
  //删除奖品级别
  rpc DelPrizeGrade(DelPrizeGradeReq) returns (DelPrizeGradeResp);
  //获取奖品级别列表
  rpc GetPrizeGradeList(GetPrizeGradeListReq) returns (GetPrizeGradeListResp);
  //获取奖品级别枚举列表
  rpc GetPrizeGradeEnums(GetPrizeGradeEnumsReq) returns (Enums);

  // PrizePool rpc

  //添加活动奖品池，某活动中的奖品信息
  rpc AddPrizePool(AddPrizePoolReq) returns (AddPrizePoolResp);
  //更新活动奖品池，某活动中的奖品信息
  rpc PutPrizePool(PutPrizePoolReq) returns (PutPrizePoolResp);
  //获取活动奖品池，某活动中的奖品信息
  rpc GetPrizePool(GetPrizePoolReq) returns (GetPrizePoolResp);
  //删除活动奖品池，某活动中的奖品信息
  rpc DelPrizePool(DelPrizePoolReq) returns (DelPrizePoolResp);
  //获取活动奖品池，某活动中的奖品信息列表
  rpc GetPrizePoolList(GetPrizePoolListReq) returns (GetPrizePoolListResp);
  //获取活动奖品池，某活动中的奖品信息枚举列表
  rpc GetPrizePoolEnums(GetPrizePoolEnumsReq) returns (Enums);

  // Project rpc

  //添加项目
  rpc AddProject(AddProjectReq) returns (AddProjectResp);
  //更新项目
  rpc PutProject(PutProjectReq) returns (PutProjectResp);
  //获取项目
  rpc GetProject(GetProjectReq) returns (GetProjectResp);
  //删除项目
  rpc DelProject(DelProjectReq) returns (DelProjectResp);
  //获取项目列表
  rpc GetProjectList(GetProjectListReq) returns (GetProjectListResp);
  //获取项目枚举列表
  rpc GetProjectEnums(GetProjectEnumsReq) returns (Enums);

  // User rpc

  //添加用户名单
  rpc AddUser(AddUserReq) returns (AddUserResp);
  //更新用户名单
  rpc PutUser(PutUserReq) returns (PutUserResp);
  //获取用户名单
  rpc GetUser(GetUserReq) returns (GetUserResp);
  //删除用户名单
  rpc DelUser(DelUserReq) returns (DelUserResp);
  //获取用户名单列表
  rpc GetUserList(GetUserListReq) returns (GetUserListResp);
  //获取用户名单枚举列表
  rpc GetUserEnums(GetUserEnumsReq) returns (Enums);

  // UserPool rpc

  //添加活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理
  rpc AddUserPool(AddUserPoolReq) returns (AddUserPoolResp);
  //更新活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理
  rpc PutUserPool(PutUserPoolReq) returns (PutUserPoolResp);
  //获取活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理
  rpc GetUserPool(GetUserPoolReq) returns (GetUserPoolResp);
  //删除活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理
  rpc DelUserPool(DelUserPoolReq) returns (DelUserPoolResp);
  //获取活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理列表
  rpc GetUserPoolList(GetUserPoolListReq) returns (GetUserPoolListResp);
  //获取活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理枚举列表
  rpc GetUserPoolEnums(GetUserPoolEnumsReq) returns (Enums);

}

service Luckydraw {

  // The content in this block will not be updated
  // 此区块内的内容不会被更新
  //[custom service start]

  // 抽奖凭证校验，验证用户身份，颁发jwt
  rpc UserIdentify (UserIdentifyReq) returns (IdentifyResp);

  // 抽奖接口
  rpc Luckydraw (LuckydrawReq) returns (LuckydrawResp);

  // 用户确认认领奖品名单，记得把剩余的改为弃领状态
  rpc SelectPrizes (SelectPrizesReq) returns (SelectPrizesResp);

  // 生产jwtToken
  rpc GenerateToken (GenerateTokenReq) returns (GenerateTokenResp);

  // 活动规则枚举
  rpc GetActivityPatternEnums (NilReq) returns (Enums);
  // 获取每个项目及其包含的活动
  rpc GetProjectTreeOptions (NilReq) returns (TreeOptions);

  //project

  // 获取项目详细
  rpc GetProjectDetail (GetProjectDetailReq) returns (GetProjectDetailResp);
  // 获取项目详细列表
  rpc GetProjectDetails (GetProjectDetailsReq) returns (GetProjectDetailsResp);

  //activity

  // 获取活动详细
  rpc GetActivityDetail (GetActivityDetailReq) returns (GetActivityDetailResp);
  // 获取活动详细列表
  rpc GetActivityDetails (GetActivityDetailsReq) returns (GetActivityDetailsResp);
  // 某项目的活动列表
  rpc GetProjectActivities (GetProjectActivitiesReq) returns (GetProjectActivitiesResp);
  // 某用户可参与的活动列表
  rpc GetUserActivities (GetUserActivitiesReq) returns (GetUserActivitiesResp);

  //prize

  // 获取某活动的奖品列表
  rpc GetActivityPrizes (GetActivityPrizesReq) returns (GetActivityPrizesResp);

  //prize pool

  // 获取某活动的奖品池
  rpc GetActivityPrizePool (GetActivityPrizePoolReq) returns (GetActivityPrizePoolResp);
  // 重置某活动奖品池的奖品运气值，由于是危险操作，所以需要同时传入 uuid 和 id
  rpc ResetActivityLuckValue (ResetActivityLuckValueReq) returns (StatusResp);

  // 获取用户详细
  rpc GetUserDetail (GetUserDetailReq) returns (GetUserDetailResp);
  // 获取用户详细列表
  rpc GetUserDetails (GetUserDetailsReq) returns (GetUserDetailsResp);
  // 通过关键词查找用户【精确查找】，关键词可以是电话、邮箱、账号
  rpc GetUserByKeyword (GetUserByKeywordReq) returns (GetUserByKeywordResp);
  // 通过关键词查找用户【模糊查找】，关键词可以是电话、邮箱、账号、姓名等等
  rpc GetUsersByKeyword (GetUsersByKeywordReq) returns (GetUsersByKeywordResp);

  // 获取中奖详情名单
  rpc GetLuckyDetailsList (LuckyDetailsReq) returns (GetLuckyDetailsResp);
  // 获取某活动的中奖详细列表
  rpc GetALuckyDetails (GetALuckyDetailsReq) returns (GetALuckyDetailsResp);
  // 获取某用户在某活动中的中奖详细列表
  rpc GetUALuckyDetails (GetUALuckyDetailsReq) returns (GetUALuckyDetailsResp);
  // 查询某用户的中奖信息
  rpc GetUserLuckyDetail (GetUserLuckyDetailReq) returns (GetUserLuckyDetailResp);
  // 通过奖品更新幸运单
  rpc PutLuckyByPrize (PutLuckyByPrizeReq) returns (StatusResp);
  // 重置奖品幸运值
  rpc ResetLuckValue (ResetLuckValueReq) returns (StatusResp);

  //[custom service end]

}

