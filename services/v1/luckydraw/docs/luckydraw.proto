// 通过关键词查找用户请求【模糊查找】
message GetUsersByKeywordReq {
  ListReq list_req = 1; //列表参数
}

// 通过关键词查找用户响应【模糊查找】
message GetUsersByKeywordResp {
  repeated User users = 1;
  int64 total = 2;
}

//请求项目详细
message GetProjectDetailReq {
  int64 project_id = 1;
}

//项目详细
message ProjectDetail {
  Project project = 1;
  repeated Activity activities = 2;
}

message GetProjectDetailResp {
  ProjectDetail project_detail = 1;
}

message GetProjectDetailsReq {
  ListReq list_req = 1; //列表参数
  Project project = 2; //Project参数
}

//多条详细数据响应
message GetProjectDetailsResp {
  repeated ProjectDetail project_details = 1;
  int64 total = 2;
}

message GetActivityDetailsReq {
  ListReq list_req = 1; //列表参数
  Activity activity = 2; //Activity参数
}

message GetActivityDetailsResp {
  repeated ActivityDetail activity_details = 1;
  int64 total = 2;
}

message GetActivityPrizePoolReq {
  int64 activity_id = 1;
}

message GetActivityPrizePoolResp {
  repeated PrizePool prize_pools = 1;
}

//公开的请求
message  GetActivityPrizesReq {
  string activity_uuid = 1; //由客户端提交
  int64 activity_id = 2; //活动ID，与uuid两者二选一
}

message  GetActivityPrizesResp {
  repeated ActivityPrize activity_prizes = 1;
}

//获取中奖详情名单
message LuckyDetailsReq {
  ListReq list_req = 1;
  //lucker表字段
  Lucky lucky = 2;
  //other表字段
  string user_name = 3;
  int64 project_id = 4;
  int64 activity_id = 5;
  string activity_name = 6;
  int64 prize_id = 7;
  string prize_name = 8;
  int64 prize_grade_id = 9;
}

message GetLuckyDetailsResp {
  repeated LuckyDetail data = 1;
  int64 total = 2;
}

// 获取某用户在某活动中的中奖详细请求
message  GetUALuckyDetailsReq {
  int64 user_id = 1; //从jwt中提取
  string activity_uuid = 2; //由客户端提交
  int64 activity_id = 3; //活动ID，与uuid两者二选一
}

// 获取某用户在某活动中的中奖详细响应
message  GetUALuckyDetailsResp {
  repeated LuckyDetail lucky_details = 1;
  int64 total = 2;
}

// 获取某活动的中奖详细列表请求
message GetALuckyDetailsReq {
  ListReq list_req = 1;  //列表参数
  Lucky lucky = 2;  //lucky表字段
  //other表字段
  string user_name = 3;
  int64 project_id = 4;
  int64 activity_id = 5;
  string activity_name = 6;
  int64 prize_id = 7;
  string prize_name = 8;
  int64 prize_grade_id = 9;
}

// 获取某活动的中奖详细列表响应
message  GetALuckyDetailsResp {
  repeated LuckyDetail lucky_details = 1;
  int64 total = 2;
}

message GetProjectActivitiesReq {
  int64 project_id = 1;
}

message GetProjectActivitiesResp {
  repeated Activity activities = 1;
}

// 获取某用户可参加活动的请求
message GetUserActivitiesReq {
  int64 user_id = 1;
}

// 获取某用户可参加活动的响应
message GetUserActivitiesResp {
  repeated UserActivity user_activities = 1;
}

// 重置某活动的运气值请求
message ResetActivityLuckValueReq {
  string activity_uuid = 1;
  int64 activity_id = 2;
}

// 通过奖品更新中奖信息请求
message PutLuckyByPrizeReq {
  Lucky lucky = 1;
  int64 prize_id = 2;
  int64 activity_id = 3;
}

// 重置奖品幸运值请求
message ResetLuckValueReq {
  int64 activity_id = 1;
  string activity_uuid = 2;
}

