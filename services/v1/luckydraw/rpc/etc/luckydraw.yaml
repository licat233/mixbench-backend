Name: luckydraw-rpc
ListenOn: 127.0.0.1:${LUCKYDRAW_RPC_PORT}
Mode: ${SERVICE_MODE}

Redis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASSWORD}
  Type: node
  Key: "luckydarw"

Mysql:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DATABASE_PREFIX}_luckydraw?${MYSQL_CONN_OPTIONS}

JwtAuth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400

Log:
  ServiceName: luckydraw-rpc
  Level: error

#监控
Prometheus:
  Host: 0.0.0.0
  Port: ${PROMETHEUS_LUCKYDRAW_RPC_PORT}
  Path: /metrics

#链路追踪
Telemetry:
  Name: luckydarw-rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Pass: ${REDIS_PASSWORD}
    Type: node

KqGoodluckConf:
  Brokers:
    - kafka:1
  Topic: goodluck-topic
