service Base {

  // Adminer rpc

  //添加管理员
  rpc AddAdminer(AddAdminerReq) returns (AddAdminerResp);
  //更新管理员
  rpc PutAdminer(PutAdminerReq) returns (PutAdminerResp);
  //获取管理员
  rpc GetAdminer(GetAdminerReq) returns (GetAdminerResp);
  //删除管理员
  rpc DelAdminer(DelAdminerReq) returns (DelAdminerResp);
  //获取管理员列表
  rpc GetAdminerList(GetAdminerListReq) returns (GetAdminerListResp);
  //获取管理员枚举列表
  rpc GetAdminerEnums(GetAdminerEnumsReq) returns (Enums);

  // Campaign rpc

  //添加活动
  rpc AddCampaign(AddCampaignReq) returns (AddCampaignResp);
  //更新活动
  rpc PutCampaign(PutCampaignReq) returns (PutCampaignResp);
  //获取活动
  rpc GetCampaign(GetCampaignReq) returns (GetCampaignResp);
  //删除活动
  rpc DelCampaign(DelCampaignReq) returns (DelCampaignResp);
  //获取活动列表
  rpc GetCampaignList(GetCampaignListReq) returns (GetCampaignListResp);
  //获取活动枚举列表
  rpc GetCampaignEnums(GetCampaignEnumsReq) returns (Enums);

  // Company rpc

  //添加公司
  rpc AddCompany(AddCompanyReq) returns (AddCompanyResp);
  //更新公司
  rpc PutCompany(PutCompanyReq) returns (PutCompanyResp);
  //获取公司
  rpc GetCompany(GetCompanyReq) returns (GetCompanyResp);
  //删除公司
  rpc DelCompany(DelCompanyReq) returns (DelCompanyResp);
  //获取公司列表
  rpc GetCompanyList(GetCompanyListReq) returns (GetCompanyListResp);
  //获取公司枚举列表
  rpc GetCompanyEnums(GetCompanyEnumsReq) returns (Enums);

  // Project rpc

  //添加项目
  rpc AddProject(AddProjectReq) returns (AddProjectResp);
  //更新项目
  rpc PutProject(PutProjectReq) returns (PutProjectResp);
  //获取项目
  rpc GetProject(GetProjectReq) returns (GetProjectResp);
  //删除项目
  rpc DelProject(DelProjectReq) returns (DelProjectResp);
  //获取项目列表
  rpc GetProjectList(GetProjectListReq) returns (GetProjectListResp);
  //获取项目枚举列表
  rpc GetProjectEnums(GetProjectEnumsReq) returns (Enums);

  // Web rpc

  //添加网站
  rpc AddWeb(AddWebReq) returns (AddWebResp);
  //更新网站
  rpc PutWeb(PutWebReq) returns (PutWebResp);
  //获取网站
  rpc GetWeb(GetWebReq) returns (GetWebResp);
  //删除网站
  rpc DelWeb(DelWebReq) returns (DelWebResp);
  //获取网站列表
  rpc GetWebList(GetWebListReq) returns (GetWebListResp);
  //获取网站枚举列表
  rpc GetWebEnums(GetWebEnumsReq) returns (Enums);

}

service Admin {

  // The content in this block will not be updated
