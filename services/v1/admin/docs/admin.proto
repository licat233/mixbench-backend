  //邮箱是否存在
  rpc ExistsEmail (ExistsEmailReq) returns (ExistsEmailResp);
  //通过邮箱查找管理员
  rpc FindByEmail (FindByEmailReq) returns (FindByEmailResp);
  //通过账号查找管理员
  rpc FindByPassport (FindByPassportReq) returns (FindByPassportResp);
  //注销登录
  rpc Logout (LogoutReq) returns (LogoutResp);
