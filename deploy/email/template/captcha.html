<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixBench 系统通知 - 账号登录提醒</title>
</head>
<body>
    <div style="width:100%">
        <div>
            <div style="background:linear-gradient(90deg,#e200ff, #00b1ff);padding:10px 0 10px 30px;color:#fff;font-size:22px;font-weight:bold;">
                MixBench 系统通知</div>
        </div>
        <div style="width: 100%;max-width: 600px;min-width:300px;margin:0 auto;background:#fff;font-size:18px;position: relative;">
            <div style="padding:0 15px;">
                <div style="color:#000;text-align:center;padding: 30px 0 10px;font-size:22px">账号登录提醒</div>
                <div style="border-bottom:1px dotted grey;border-top:1px dotted grey;padding: 20px 0;">
                    <div>尊敬的用户，您好！</div>
                    <div style="padding: 8px 36px">
                        <p>您的账号于 __DATETIME__ 尝试登录mixbench，请关注此次登录行为；</p>
                        <p>此次登录的验证码为：<span style="color:#fff;padding: 2px 10px;background-color: #000;border: 1px solid #fff;box-shadow: 0 0 0 1px #000;letter-spacing: 1px;">__CAPTCHA__</span> ；</p>
                        <p>账号ID：__ACCOUNT__</p>
                        <p>账号IP：__IP__</p>
                        <p>登录地点：__ADDRESS__</p>
                        <p>为了保证账号安全，验证码有效期为5分钟。请确认为本人操作，切勿向他人泄露，感谢您的理解与使用。</p>
                        <p style="text-align:right;margin-bottom: 0;">此邮箱为系统邮箱，请勿回复。</p>
                    </div>
                </div>
            </div>
            <div style="background:#eee;padding:10px;font-size:10px;text-align:center;position: fixed;bottom: 0;left: 0;width: 100%;">
                <a style="text-decoration: none;display: block;color: initial;" href="http://www.mixbench.net" target="_blank" rel="nofollow">@mixbench.net</a>
            </div>
        </div>
    </div>
</body>
</html>
