server {
    listen 80;
    listen 443;
    server_name kafka.mixbench.net;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/common;

    proxy_set_header Host $host; #设置真实客户端地址，默认值是 $proxy_host;
    proxy_set_header permissions-policy interest-cohort=(); # 不希望加入谷歌的 FLoC

    include /etc/nginx/conf.d/component/err_page.conf;

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ .*(\.jpg|jpeg|gif|png|ico|css|pdf|ppt|txt|bmp|rtf|ttf|svg|js)?$ {
        # auth_request /v1/api/admin/superAdminAuth;
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
        proxy_pass http://kafka_manage:9000;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /var/log/nginx/kafka.mixbench.net.log;
    error_log  /var/log/nginx/kafka.mixbench.net.error.log;
}