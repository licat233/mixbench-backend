# generator time: 2022-12-05

upstream kafka-servers{
    server kafka_manage:9000;
}

server {
    listen 80;
    listen 443;
    server_name kafka.mixbench.net;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/common;

    #ERROR-PAGE-START  404配置，可以注释、删除或修改
    error_page 404 /www/common/404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    proxy_set_header Host $host;

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ .*\.(jpg|jpeg|gif|png|ico|css|pdf|ppt|txt|bmp|rtf|ttf|svg|js)$ {
        proxy_pass http://kafka-servers;
        expires 30d;
        add_header Cache-Control public;
    }

    location / {
        proxy_pass http://kafka-servers;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    
    access_log  /var/log/nginx/kafka.mixbench.net.log;
    error_log  /var/log/nginx/kafka.mixbench.net.error.log;
}