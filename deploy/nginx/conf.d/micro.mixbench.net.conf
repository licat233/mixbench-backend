# 负载均衡的写法
# 在http块中的全局块中配置

# 这段 Nginx 配置的作用是将 HTTP 头部中的 Upgrade 字段的值为 "websocket" 的请求转换为 WebSocket 连接，从而实现升级握手。它使用了 Nginx 的 map 指令来定义一个映射变量 $connection_upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# upstream固定写法 后面的myserver可以自定义
upstream admin_server {
    server app:7011;
    keepalive 1000; # 默认值100，可能不够用
}

upstream captcha_server {
    server app:7021;
}

upstream luckydraw_server {
    server app:7031;
}

upstream chat_server {
    server app:7041;
}

server {
    listen 80;
    server_name micro.mixbench.net;
    index index.php index.html index.htm default.php default.htm default.html;

    # CORS_CONFIG
    add_header 'Access-Control-Allow-Origin' '*'; # 允许跨域请求的域，*代表所有
    add_header 'Access-Control-Allow-Credentials' 'true'; # 允许带上cookie请求
    add_header 'Access-Control-Allow-Methods' '*'; #允许请求的方法，比如 GET/POST/PUT/DELETE
    add_header 'Access-Control-Allow-Headers' '*'; # 允许请求的header

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # PROXY_CONFIG 已经在正向nginx代理中设置，此处不能再设置

    include /etc/nginx/conf.d/components/err_page.conf;

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # 鉴权端口
    location = /v1/api/admin/auth {
        internal;
        proxy_pass http://app:7011;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 代理端口
    location /v1/api/admin/ {
        # 负载均衡写法
        proxy_pass http://admin_server;
    }

    location /v1/api/captcha/ {
        # 该服务不需要鉴权
        # auth_request /v1/api/admin/auth;
        proxy_pass http://captcha_server;
    }

    location /v1/api/luckydraw/ {
        # 调用nginx的auth模块鉴权
        auth_request /v1/api/admin/auth;
        proxy_pass http://luckydraw_server;
    }

    location /v1/api/chat/ {
        # 走自己的鉴权
        proxy_pass http://chat_server;
    }

    # 静态资源服务

    location /v1/static/admin/ {
        proxy_pass http://admin_server;
        add_header Cache-Control public;
    }

    location /v1/static/captcha/ {
        proxy_pass http://captcha_server;
        add_header Cache-Control public;
    }

    location /v1/static/luckydraw/ {
        proxy_pass http://luckydraw_server;
        add_header Cache-Control public;
    }

    location /v1/static/chat/ {
        proxy_pass http://chat_server;
        add_header Cache-Control public;
    }

    # 使用 root 声明的是根目录，经过 location 匹配后，直接去根目录下找访问路径中 sever_name 后面的文件地址。
    # 使用 alias 声明的是别名目录，经过 location 匹配后，去别名目录下找访问路径中 sever_name 后面除去 location 匹配的地址的剩余地址。这就好像给 location 匹配的地址取了个别名一样。
    #静态文件夹配置：http://host/static/**.txt
    # 已废弃
    # location /static/ {
    #     root /www/micro.mixbench.net;
    #     # autoindex on;
    # }
    # #静态文件夹配置
    #location /static/ {  # 这里的 "/static" 是别名，并非路径，匹配时不带入
    #    alias /www/micro.mixbench.net/static/;
    #    # autoindex on;
    #}

    location / {
        root /www/micro.mixbench.net;
    }

    access_log  /var/log/nginx/micro.mixbench.net.log;
    error_log  /var/log/nginx/micro.mixbench.net.error.log;
}
