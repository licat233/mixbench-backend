server {
    listen 80;
    listen 443 ssl http2;
    server_name static.mixbench.net;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/static.mixbench.net;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #HTTP_TO_HTTPS_START
    # if ($server_port !~ 443) {
    #     rewrite ^(/.*)$ https://$host$1 permanent;
    # }
    #error_page 404/404.html;
    ssl_certificate /etc/nginx/ssl/static.mixbench.net/server.pem;
    ssl_certificate_key /etc/nginx/ssl/static.mixbench.net/server.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 5m;
    #SSL-END

    #ERROR-PAGE-START  404配置，可以注释、删除或修改
    error_page 404 /www/common/404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /var/log/nginx/static.mixbench.net.log;
    error_log  /var/log/nginx/static.mixbench.net.error.log;
}