        proxy_pass http://internal_nginx_http_server; # 真实服务器的地址，可以是ip也可以是域名和url地址
    }
    access_log /Users/licat/nginx/logs/static.mixbench.net.log;
    error_log /Users/licat/nginx/logs/static.mixbench.net.error.log;
}

