# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).
  external_labels:
    monitor: 'codelab-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    scrape_interval: 5s  #global catch time
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: 'admin-api'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_ADMIN_API_PORT}' ]
        labels:
          job: admin-api
          app: admin-api
          env: dev
  - job_name: 'admin-rpc'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_ADMIN_RPC_PORT}' ]
        labels:
          job: admin-rpc
          app: admin-rpc
          env: dev
  - job_name: 'captcha-api'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_AUTHENTICATION_API_PORT}' ]
        labels:
          job: captcha-api
          app: captcha-api
          env: dev
  - job_name: 'captcha-rpc'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_AUTHENTICATION_RPC_PORT}' ]
        labels:
          job: captcha-rpc
          app: captcha-rpc
          env: dev
  - job_name: 'luckdarw-api'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_LUCKYDRAW_API_PORT}' ]
        labels:
          job: luckdarw-api
          app: luckdarw-api
          env: dev
  - job_name: 'luckdarw-rpc'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_LUCKYDRAW_RPC_PORT}' ]
        labels:
          job: luckdarw-rpc
          app: luckdarw-rpc
          env: dev
  - job_name: 'luckdarw-mq'
    static_configs:
      - targets: [ 'app:${PROMETHEUS_LUCKYDRAW_MQ_PORT}' ]
        labels:
          job: luckdarw-mq
          app: luckdarw-mq
          env: dev