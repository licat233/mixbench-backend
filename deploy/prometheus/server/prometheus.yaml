global:
  scrape_interval:
  external_labels:
    monitor: 'codelab-monitor'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s  #global catch time
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'admin-api'
    static_configs:
      - targets: [ 'luckdraw:7101' ]
        labels:
          job: admin-api
          app: admin-api
          env: dev
  - job_name: 'admin-rpc'
    static_configs:
      - targets: [ 'luckdarw:7102' ]
        labels:
          job: admin-rpc
          app: admin-rpc
          env: dev
  - job_name: 'captcha-api'
    static_configs:
      - targets: [ 'captcha:7103' ]
        labels:
          job: captcha-api
          app: captcha-api
          env: dev
  - job_name: 'captcha-rpc'
    static_configs:
      - targets: [ 'luckdarw:7104' ]
        labels:
          job: captcha-rpc
          app: captcha-rpc
          env: dev
  - job_name: 'luckdarw-api'
    static_configs:
      - targets: [ 'luckdarw:7105' ]
        labels:
          job: luckdarw-api
          app: luckdarw-api
          env: dev
  - job_name: 'luckdarw-rpc'
    static_configs:
      - targets: [ 'luckdarw:7106' ]
        labels:
          job: luckdarw-rpc
          app: luckdarw-rpc
          env: dev
  - job_name: 'luckdarw-mq'
    static_configs:
      - targets: [ 'luckdarw:7107' ]
        labels:
          job: luckdarw-mq
          app: luckdarw-mq
          env: dev


