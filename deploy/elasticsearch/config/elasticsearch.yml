network.host: 0.0.0.0
http.cors.enabled: true
http.cors.allow-origin: "*"

# discovery.seed_hosts: ["127.0.0.1"]

discovery.type: single-node #以单一节点模式启动
# 启动时会去更新地图的一些数据库，这里直接禁掉
ingest.geoip.downloader.enabled: false

cluster.name: es-cluster
node.name: es-node
node.data: true
node.master: true
# 当[discovery.type]设置为[single-nodes]时，不允许设置[cluster.ininitial_master_nodes]
# cluster.initial_master_nodes: ["es-node"]

bootstrap.memory_lock: false  #是否锁住内存,避免交换(swapped)带来的性能损失,默认值是: false
xpack.security.enabled: false # xpack认证
xpack.security.authc.api_key.enabled: false # 为了能够我们使用 API key 的方式来访问 Elasticsearch
xpack.security.http.ssl.enabled: false # 与客户端http链接是否加密
# xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
# xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
# xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
# xpack.security.http.ssl.verification_mode: certificate
# xpack.security.transport.ssl.enabled: true # 与客户端http链接是否加密
# xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
# xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
# xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
# xpack.security.transport.ssl.verification_mode: certificate
# xpack.license.self_generated.type: basic # x-pack安全设置，这里选择basic，基础设置，如果选择了trail，则会在30天后到期


