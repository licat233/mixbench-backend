Name: admin-rpc
ListenOn: 127.0.0.1:${ADMIN_RPC_PORT}

Mode: ${SERVICE_MODE}
Debug: ${SERVICE_DEBUG}

Redis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASSWORD}
  Type: node

Log:
  ServiceName: admin-rpc
  Level: error

#监控
Prometheus:
  Host: 0.0.0.0
  Port: ${PROMETHEUS_ADMIN_RPC_PORT}
  Path: /metrics

#链路追踪
Telemetry:
  Name: admin-rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

JwtAuth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400

Mysql:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DATABASE}?${MYSQL_CONN_OPTIONS}

CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Pass: ${REDIS_PASSWORD}
    Type: node
