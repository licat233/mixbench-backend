syntax = "proto3";

//指定文件生成出来的包名，用于import
package admin_proto;

//使用any类型需要导入这个
// import "google/protobuf/any.proto";

option go_package = "./admin_pb";



message TestReq {
  string data = 1;
}

message TestResp {
  string data = 1;
}

message Activity {
  int64   id = 1;
  string uuid = 2;
  string name = 3;
  int64 project_id = 4;
  int64 status = 5; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 6; //方案: 0私密的，1公开的
  int64 max_count = 7; //单人最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 8; //单人最大获奖数:  -1表示无限制，0表示不可领奖
  int64 start_time = 9; //活动开始时间
  int64 end_time = 10; //活动结束时间
}

message Adminer {
  int64   id = 1;
  string uuid = 2;
  string name = 3;
  string avatar = 4;
  string passport = 5;
  string password = 6;
  string email = 7;
  int64 status = 8;
  int64 is_super_admin = 9;
  int64 login_count = 10;
  int64 last_login = 11;
}

message Lucky {
  int64   id = 1;
  string uuid = 2;
  int64 user_id = 3;
  int64 prize_pool_id = 4;
  int64 status = 5;  //状态: 0未领奖，1已领奖，2放弃领奖
  int64 luck_date = 6;
  string ip = 7;
}

message Prize {
  int64 id = 1;
  string uuid = 2;
  string name = 3;
  string image = 4;
  double price = 5;
  int64 status = 6;
}

message PrizePool {
  int64   id = 1;
  string uuid = 2;
  int64 activity_id = 3;
  int64 prize_id = 4;
  int64 grade_id = 7;
  int64 luck_value = 5;
  int64 status = 6;
  int64 total = 8;
  int64 remainder = 9;
}

message PrizeGrade {
  int64   id = 1;
  string name = 2;
  int64 is_win = 3;
}

message Project {
  int64 id = 1;
  string uuid = 2;
  string name = 3;
  int64 status = 4;
}

message User {
  int64 id = 1;
  string uuid = 2;
  string passport = 3;
  string email = 4;
  string phone = 5;
  string name = 6;
  string address = 7;
  int64 score = 8;
  int64 status = 9;  // 状态:0未授权，1正常，2已冻结
}

message UserPool {
  int64   id = 1;
  string uuid = 2;
  int64 activity_id = 3;
  int64 user_id = 4;
  int64 status = 5;  //状态:0未授权，1正常，2已冻结
  int64 score = 6;
}

message Policy {
  string sub = 1;
  string dom = 2;
  string obj = 3;
  string act = 4;
}


message LuckyDetail {
  //中奖信息
  Lucky lucky = 1;

  //中奖用户信息
  User user = 2;

  //奖品池信息
  PrizePool prize_pool = 3;

  //活动信息
  Activity activity = 4;

  //奖品信息
  Prize prize = 5;

  //奖品级别
  PrizeGrade prize_grade = 6;

  //项目信息
  Project project = 7;
}



message JwtData {
  int64 user_id = 1;
  string ip = 2;
  string platform = 3;
}

message JwtToken {
  string access_token = 1;
  int64 access_expire = 2;
  int64 refresh_after = 3;
}


//枚举基本类型
message Enum {
  string label = 1;
  int64  value = 2;
}

message TreeOptions {
  string title = 1;
  int64  value = 2;
  repeated TreeOptions children = 3;
}

message EnumListReq{
}

message GetActivityEnumListReq{
  int64 project_id = 1;
}

//枚举列表
message EnumListResp{
  repeated Enum data = 1;
}

message GetProjectDetailReq {
  int64 project_id = 1;
}

message ProjectDetails {
  Project project = 1;
  repeated Activity activities = 2;
}

message GetProjectDetailResp {
  ProjectDetails data = 1;
}

message ProjectTreeOptionsResp {
  repeated TreeOptions data = 1;
}

message ActivityDetails {
  Activity activity = 1;
  repeated ActivityPrize activity_prizes = 2;
}

//每个用户的信息，包含参与的活动信息
message UserDetails {
  User user = 1;
  repeated UserActivity user_activities = 2;
}

//基本数据结构 end

//请求结构体

message GenerateTokenReq {
  JwtData jwt_data = 1; //jwt数据
  bool auto_login = 2; //自动登录，1天或者7天免登录
}

message GenerateTokenResp {
  JwtToken jwt_token = 1;
}

message LoginReq {
  string passport = 1;
  string password = 2;
  bool auto_login = 3; //自动登录，1天或者7天免登录
  JwtData jwt_data = 4; //登录需要提供jwt数据
}

message LoginResp {
  JwtToken jwt_token = 2;
}

message LoginByEmailReq {
  string email = 1;
  bool auto_login = 2; //自动登录，1天或者7天免登录
  JwtData jwt_data = 3; //登录需要提供jwt数据
}

message ExsitEmailReq {
  string email = 1;
}

message ExsitEmailResp {
  bool exsit = 1;
}

message FindByEmailReq {
  string email = 1;
}

message FindByEmailResp {
  Adminer adminer = 1;
}

message LogoutReq {
  string jwt_token = 1;
  string platform = 2;
  string ip = 3;
}

message LogoutResp {
}

message IsLogoutReq {
  string jwt_token = 1;
}

message IsLogoutResp {
  bool status = 1;
}

message ParseJwtTokenReq {
  string jwt_token = 1;
  string secret = 2;
}

message ParseJwtTokenResp {
  map<string, string> claims = 1;
}

message GetActivityDetailReq{
  int64 activity_id = 1;
}

message GetUserDetailReq {
  int64 user_id = 1;
}

//-----------

//列表数据请求
message ListReq {
  int64 page_size = 1;
  int64 page = 2;
  string keyword = 3;
}

//单个数据请求
message ItemReq{
  int64 id = 1;
}

//状态响应
message StatusResp {
}

//添加单条数据响应
message AddActivityResp{
  Activity activity = 1;
}

message AddAdminerResp{
  Adminer adminer = 1;
}

message AddLuckyResp{
  Lucky lucky = 1;
}

message AddPrizeResp{
  Prize prize = 1;
}

message AddPrizeGradeResp {
  PrizeGrade prize_grade = 1;
}

message AddPrizePoolResp{
  PrizePool prize_pool = 1;
}

message AddProjectResp{
  Project project = 1;
}

message AddUserResp{
  User user = 1;
}

message AddUserPoolResp{
  UserPool user_pool = 1;
}

//获取单条数据响应
message GetActivityResp{
  Activity activity = 1;
}

message GetAdminerResp{
  Adminer adminer = 1;
}

message GetLuckyResp{
  Lucky lucky = 1;
}

message GetPrizeResp{
  Prize prize = 1;
}

message GetPrizeGradeResp{
  PrizeGrade prize_grade = 1;
}

message GetPrizePoolResp{
  PrizePool prize_pool = 1;
}

message GetProjectResp{
  Project project = 1;
}

message GetUserResp{
  User user = 1;
}

message GetUserPoolResp{
  UserPool user_pool = 1;
}

message GetActivityDetailResp{
  ActivityDetails data = 1;
}

message GetUserDetailResp{
  UserDetails data = 1;
}

//多条数据响应
message GetActivityListResp {
  repeated Activity data = 1;
  int64 total = 2;
}

message GetAdminerListResp {
  repeated Adminer data = 1;
  int64 total = 2;
}

message GetLuckyListResp {
  repeated Lucky data = 1;
  int64 total = 2;
}

message GetLuckyDetailsResp {
  repeated LuckyDetail data = 1;
  int64 total = 2;
}

message GetPrizeListResp {
  repeated Prize data = 1;
  int64 total = 2;
}

message GetPrizeGradeListResp {
  repeated PrizeGrade data = 1;
  int64 total = 2;
}

message GetPrizePoolListResp {
  repeated PrizePool data = 1;
  int64 total = 2;
}

message GetProjectListResp {
  repeated Project data = 1;
  int64 total = 2;
}

message GetUserListResp {
  repeated User data = 1;
  int64 total = 2;
}

//多条详细数据响应
message GetProjectDetailsListResp {
  repeated ProjectDetails data = 1;
  int64 total = 2;
}

message GetActivityDetailsListResp {
  repeated ActivityDetails data = 1;
  int64 total = 2;
}

message GetUserDetailsListResp {
  repeated UserDetails data = 1;
  int64 total = 2;
}

//用户池列表响应
message GetUserPoolListResp {
  repeated UserPool data = 1;
  int64 total = 2;
}

//搜索请求
message SearchPrizePoolReq{
  int64 activity_id = 1;
}

message SearchPrizePoolResp {
  repeated PrizePool data = 1;
}

//用户活动
message UserActivity {
  Activity activity = 1;
  UserPool user_pool = 2;
}

message UserActivityReq {
  int64 user_id = 1;
}

message UserActivityResp {
  repeated UserActivity data = 1;
}

//活动奖品
message ActivityPrize {
  Prize prize = 1;
  PrizePool prize_pool = 2;
  PrizeGrade prize_grade = 3;
}

message ActivityPrizesReq {
  int64 activity_id = 1;
}

message ActivityPrizesResp {
  repeated ActivityPrize data = 1;
}

message ProjectActivityReq {
  int64 project_id = 1;
}

message ProjectActivityResp {
  repeated Activity data = 1;
}

message LuckyDetailsReq {
  ListReq list_req = 1;
  //lucky表字段
  Lucky lucky = 2;
  //other表字段
  string user_name = 3;
  int64 project_id = 4;
  int64 activity_id = 5;
  string activity_name = 6;
  int64 prize_id = 7;
  string prize_name = 8;
  int64 prize_grade_id = 9;
}

message LuckyPutByPrizeReq {
  int64   id = 1;
  string uuid = 2;
  int64 user_id = 3;
  int64 prize_id = 4;
  int64 activity_id = 5;
  int64 status = 6;  //状态: 0未领奖，1已领奖，2放弃领奖
  int64 luck_date = 7;
  string ip = 8;
}

message LuckyPutReq {
  int64   id = 1;
  string uuid = 2;
  int64 user_id = 3;
  int64 prize_pool_id = 4;
  int64 status = 5;  //状态: 0未领奖，1已领奖，2放弃领奖
  int64 luck_date = 6;
  string ip = 7;
}

//list搜索
message AdminerListReq {
  ListReq list_req = 1;
  Adminer adminer = 2;
}

message UserListReq {
  ListReq list_req = 1;
  User user = 2;
}

message UserPoolListReq {
  ListReq list_req = 1;
  UserPool user_pool = 2;
}

message ProjectListReq {
  ListReq list_req = 1;
  Project project = 2;
}

message ActivityListReq {
  ListReq list_req = 1;
  Activity activity = 2;
}

message PrizeListReq {
  ListReq list_req = 1;
  Prize prize = 2;
}

message PrizePoolListReq {
  ListReq list_req = 1;
  PrizePool prize_pool = 2;
}

message PrizeGradeListReq {
  ListReq list_req = 1;
  PrizeGrade prize_grade = 2;
}

message LuckyListReq {
  ListReq list_req = 1;
  Lucky lucky = 2;
}

message NilReq{
}

message VerifyPasswordReq {
  int64 adminer_id = 1;
  string password = 2;
}

message VerifyPasswordResp {
  bool ok = 1;
}

message PutPasswordReq {
  int64  adminer_id = 1;
  string old_password = 2; // 旧密码
  string new_password = 3; // 新密码
  string captcha_id = 4; //验证码ID
  string solution = 5; //验证码答案
}

message ResetLuckValueReq {
  int64 activity_id = 1;
  string activity_uuid = 2;
}

service Admin {
  //预留的调试端口
  rpc Test (TestReq) returns (TestResp);
  //生产token
  rpc GenerateToken (GenerateTokenReq) returns (GenerateTokenResp);
  //账号登录
  rpc Login (LoginReq) returns (LoginResp);
  //邮箱登录，注意避免同个邮箱，多点同时登陆带来的耦合性问题
  rpc LoginByEmail (LoginByEmailReq) returns (LoginResp);
  //邮箱是否存在
  rpc ExsitEmail (ExsitEmailReq) returns (ExsitEmailResp);
  //通过邮箱查找管理员
  rpc FindByEmail (FindByEmailReq) returns (FindByEmailResp);
  //注销登录
  rpc Logout (LogoutReq) returns (LogoutResp);
  //是否已经注销
  rpc IsLogout (IsLogoutReq) returns (IsLogoutResp);
  //解析 jwtToken, 返回原生error
  rpc ParseJwtToken (ParseJwtTokenReq) returns (ParseJwtTokenResp);
  //验证管理员密码
  rpc VerifyPassword (VerifyPasswordReq) returns (VerifyPasswordResp);

  rpc GetAdminerList (AdminerListReq) returns (GetAdminerListResp);
  rpc GetAdminer (ItemReq) returns (GetAdminerResp);
  rpc AddAdminer (Adminer) returns (AddAdminerResp);
  rpc PutAdminer (Adminer) returns (StatusResp);
  rpc DelAdminer (ItemReq) returns (StatusResp);
  rpc PutPassword (PutPasswordReq) returns (StatusResp);

  rpc GetProjectList (ProjectListReq) returns (GetProjectListResp);
  rpc GetProject (ItemReq) returns (GetProjectResp);
  rpc AddProject (Project) returns (AddProjectResp);
  rpc PutProject (Project) returns (StatusResp);
  rpc DelProject (ItemReq) returns (StatusResp);
  rpc GetProjectDetail (GetProjectDetailReq) returns (GetProjectDetailResp);
  rpc GetProjectDetails (ProjectListReq) returns (GetProjectDetailsListResp);

  rpc GetActivityList (ActivityListReq) returns (GetActivityListResp);
  rpc GetActivityDetail (GetActivityDetailReq) returns (GetActivityDetailResp);
  rpc GetActivityDetails (ActivityListReq) returns (GetActivityDetailsListResp);
  rpc GetActivity (ItemReq) returns (GetActivityResp);
  rpc AddActivity (Activity) returns (AddActivityResp);
  rpc PutActivity (Activity) returns (StatusResp);
  rpc DelActivity (ItemReq) returns (StatusResp);
  rpc ProjectActivity (ProjectActivityReq) returns (ProjectActivityResp);

  rpc GetPrizeList (PrizeListReq) returns (GetPrizeListResp);
  rpc GetPrize (ItemReq) returns (GetPrizeResp);
  rpc AddPrize (Prize) returns (AddPrizeResp);
  rpc PutPrize (Prize) returns (StatusResp);
  rpc DelPrize (ItemReq) returns (StatusResp);
  rpc ActivityPrizes (ActivityPrizesReq) returns (ActivityPrizesResp);

  rpc GetPrizeGradeList (PrizeGradeListReq) returns (GetPrizeGradeListResp);
  rpc GetPrizeGrade (ItemReq) returns (GetPrizeGradeResp);
  rpc AddPrizeGrade (PrizeGrade) returns (AddPrizeGradeResp);
  rpc PutPrizeGrade (PrizeGrade) returns (StatusResp);
  rpc DelPrizeGrade (ItemReq) returns (StatusResp);

  rpc GetPrizePoolList (PrizePoolListReq) returns (GetPrizePoolListResp);
  rpc GetPrizePool (ItemReq) returns (GetPrizePoolResp);
  rpc AddPrizePool (PrizePool) returns (AddPrizePoolResp);
  rpc PutPrizePool (PrizePool) returns (StatusResp);
  rpc DelPrizePool (ItemReq) returns (StatusResp);
  rpc SearchPrizePool (SearchPrizePoolReq) returns (SearchPrizePoolResp);
  rpc ResetLuckValue (ResetLuckValueReq) returns (StatusResp);

  rpc GetUserList (UserListReq) returns (GetUserListResp);
  rpc GetUserDetail (GetUserDetailReq) returns (GetUserDetailResp);
  rpc GetUserDetails (UserListReq) returns (GetUserDetailsListResp);
  rpc GetUser (ItemReq) returns (GetUserResp);
  rpc AddUser (User) returns (AddUserResp);
  rpc PutUser (User) returns (StatusResp);
  rpc DelUser (ItemReq) returns (StatusResp);
  rpc UserActivity (UserActivityReq) returns (UserActivityResp);

  rpc GetUserPoolList (UserPoolListReq) returns (GetUserPoolListResp);
  rpc GetUserPool (ItemReq) returns (GetUserPoolResp);
  rpc AddUserPool (UserPool) returns (AddUserPoolResp);
  rpc PutUserPool (UserPool) returns (StatusResp);
  rpc DelUserPool (ItemReq) returns (StatusResp);

  rpc GetLuckyList (LuckyListReq) returns (GetLuckyListResp);
  rpc GetLuckyDetailsList (LuckyDetailsReq) returns (GetLuckyDetailsResp);
  rpc GetLucky (ItemReq) returns (GetLuckyResp);
  rpc AddLucky (Lucky) returns (AddLuckyResp);
  rpc PutLucky (LuckyPutReq) returns (StatusResp);
  rpc PutLuckyByPrize (LuckyPutByPrizeReq) returns (StatusResp);
  rpc DelLucky (ItemReq) returns (StatusResp);

  rpc GetAdminerEnumList (EnumListReq) returns (EnumListResp);
  rpc GetProjectEnumList (EnumListReq) returns (EnumListResp);
  rpc GetActivityEnumList (GetActivityEnumListReq) returns (EnumListResp);
  rpc GetPrizeEnumList (EnumListReq) returns (EnumListResp);
  rpc GetPrizeGradeEnumList (EnumListReq) returns (EnumListResp);
  rpc GetLuckyEnumList (EnumListReq) returns (EnumListResp);
  rpc GetUserEnumList (EnumListReq) returns (EnumListResp);
  rpc ActivityPatternEnumList (NilReq) returns (EnumListResp);
  rpc GetProjectTreeOptions (EnumListReq) returns (ProjectTreeOptionsResp);
}

