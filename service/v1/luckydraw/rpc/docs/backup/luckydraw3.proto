syntax = "proto3";

package luckydraw_proto;

option go_package ="./luckydraw_pb";
// ------------------------------------ 
// Common Messages
// ------------------------------------ 

message Enum {
  string label = 1; //标签
  int64 value = 2; //值
}

message GetEnumsResp {
  repeated Enum enums = 1; //enum列表
}

message Option {
  string title = 1; //标题
  int64 value = 2; //值
}

message Options {
  repeated Option option_list = 1; //普通选项列表数据
}

message TreeOption {
  string title = 1; //标题
  int64 value = 2; //值
  repeated TreeOption children = 3; //子集
}

message TreeOptions {
  repeated TreeOption tree_option_list = 1; //树形选项列表数据
}

message StatusResp {
}

message ListReq {
  int64 page_size = 1; //页容量
  int64 page = 2; //页码
  string keyword = 3; //关键词
}

message NilReq {
}

message NilResp {
}


// ------------------------------------ 
// Messages
// ------------------------------------ 

//---活动---
message Activity {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //活动名称
  int64 project_id = 4; //项目id
  int64 status = 5; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 6; //方案: 0会员制，1公开制，2会员需授权
  int64 max_count = 7; //最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 8; //最大抽奖次数：-1表示无限制，0表示不可中奖
  int64 start_time = 9; //活动开始时间
  int64 end_time = 10; //活动结束时间
  int64 create_at = 11; //创建时间
  int64 update_at = 12; //更新时间
}

message AddActivityReq {
  string name = 1; //活动名称
  int64 project_id = 2; //项目id
  int64 status = 3; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 4; //方案: 0会员制，1公开制，2会员需授权
  int64 max_count = 5; //最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 6; //最大抽奖次数：-1表示无限制，0表示不可中奖
  int64 start_time = 7; //活动开始时间
  int64 end_time = 8; //活动结束时间
}

message AddActivityResp {
  Activity activity = 1; //活动-信息
}

message PutActivityReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //活动名称
  int64 project_id = 4; //项目id
  int64 status = 5; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 6; //方案: 0会员制，1公开制，2会员需授权
  int64 max_count = 7; //最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 8; //最大抽奖次数：-1表示无限制，0表示不可中奖
  int64 start_time = 9; //活动开始时间
  int64 end_time = 10; //活动结束时间
}

message PutActivityResp {
}

message DelActivityReq {
  int64 id = 1; //Activity ID
}

message DelActivityResp {
}

message GetActivityByIdReq {
  int64 id = 1; //Activity ID
}

message GetActivityByIdResp {
  Activity activity = 1; //活动(activity)
}

message GetActivityListReq {
  ListReq list_req = 1; //列表页码参数
  Activity activity = 2; //Activity参数
}

message GetActivityListResp {
  repeated Activity activities = 1; //activity
  int64 total = 2; //总数量
}

message GetActivityEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---中奖名单---
message Lucky {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 user_id = 3; //中奖用户id
  int64 prize_pool_id = 4; //所属奖品池id
  int64 status = 5; //状态: 0未领奖，1已领奖，2弃领
  int64 luck_date = 6; //抽奖时间
  string ip = 7; //ip地址
  int64 create_at = 8; //创建时间
  int64 update_at = 9; //更新时间
}

message AddLuckyReq {
  int64 user_id = 1; //中奖用户id
  int64 prize_pool_id = 2; //所属奖品池id
  int64 status = 3; //状态: 0未领奖，1已领奖，2弃领
  int64 luck_date = 4; //抽奖时间
  string ip = 5; //ip地址
}

message AddLuckyResp {
  Lucky lucky = 1; //中奖名单-信息
}

message PutLuckyReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 user_id = 3; //中奖用户id
  int64 prize_pool_id = 4; //所属奖品池id
  int64 status = 5; //状态: 0未领奖，1已领奖，2弃领
  int64 luck_date = 6; //抽奖时间
  string ip = 7; //ip地址
}

message PutLuckyResp {
}

message DelLuckyReq {
  int64 id = 1; //Lucky ID
}

message DelLuckyResp {
}

message GetLuckyByIdReq {
  int64 id = 1; //Lucky ID
}

message GetLuckyByIdResp {
  Lucky lucky = 1; //中奖名单(lucky)
}

message GetLuckyListReq {
  ListReq list_req = 1; //列表页码参数
  Lucky lucky = 2; //Lucky参数
}

message GetLuckyListResp {
  repeated Lucky luckies = 1; //lucky
  int64 total = 2; //总数量
}

message GetLuckyEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---奖品名单---
message Prize {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //奖品名称
  string image = 4; //奖品图片
  double price = 5; //奖品价格
  int64 status = 6; //是否可用
  int64 create_at = 7; //创建时间
  int64 update_at = 8; //更新时间
}

message AddPrizeReq {
  string name = 1; //奖品名称
  string image = 2; //奖品图片
  double price = 3; //奖品价格
  int64 status = 4; //是否可用
}

message AddPrizeResp {
  Prize prize = 1; //奖品名单-信息
}

message PutPrizeReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //奖品名称
  string image = 4; //奖品图片
  double price = 5; //奖品价格
  int64 status = 6; //是否可用
}

message PutPrizeResp {
}

message DelPrizeReq {
  int64 id = 1; //Prize ID
}

message DelPrizeResp {
}

message GetPrizeByIdReq {
  int64 id = 1; //Prize ID
}

message GetPrizeByIdResp {
  Prize prize = 1; //奖品名单(prize)
}

message GetPrizeListReq {
  ListReq list_req = 1; //列表页码参数
  Prize prize = 2; //Prize参数
}

message GetPrizeListResp {
  repeated Prize prizes = 1; //prize
  int64 total = 2; //总数量
}

message GetPrizeEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---奖品级别---
message PrizeGrade {
  int64 id = 1; //表主键
  string name = 2; //级别名称
  int64 is_win = 3; //是否中奖
  int64 create_at = 4; //创建时间
  int64 update_at = 5; //更新时间
}

message AddPrizeGradeReq {
  string name = 1; //级别名称
  int64 is_win = 2; //是否中奖
}

message AddPrizeGradeResp {
  PrizeGrade prize_grade = 1; //奖品级别-信息
}

message PutPrizeGradeReq {
  int64 id = 1; //表主键
  string name = 2; //级别名称
  int64 is_win = 3; //是否中奖
}

message PutPrizeGradeResp {
}

message DelPrizeGradeReq {
  int64 id = 1; //PrizeGrade ID
}

message DelPrizeGradeResp {
}

message GetPrizeGradeByIdReq {
  int64 id = 1; //PrizeGrade ID
}

message GetPrizeGradeByIdResp {
  PrizeGrade prize_grade = 1; //奖品级别(prize_grade)
}

message GetPrizeGradeListReq {
  ListReq list_req = 1; //列表页码参数
  PrizeGrade prize_grade = 2; //PrizeGrade参数
}

message GetPrizeGradeListResp {
  repeated PrizeGrade prize_grades = 1; //prize_grade
  int64 total = 2; //总数量
}

message GetPrizeGradeEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---活动奖品池，某活动中的奖品信息---
message PrizePool {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 activity_id = 3; //活动id
  int64 prize_id = 4; //奖品id
  int64 grade_id = 5; //奖品等级
  int64 luck_value = 6; //幸运值
  int64 status = 7; //是否可用，0不可用，1可用
  int64 total = 8; //奖品总数量
  int64 remainder = 9; //奖品剩余数量
  int64 create_at = 10; //创建时间
  int64 update_at = 11; //更新时间
}

message AddPrizePoolReq {
  int64 activity_id = 1; //活动id
  int64 prize_id = 2; //奖品id
  int64 grade_id = 3; //奖品等级
  int64 luck_value = 4; //幸运值
  int64 status = 5; //是否可用，0不可用，1可用
  int64 total = 6; //奖品总数量
  int64 remainder = 7; //奖品剩余数量
}

message AddPrizePoolResp {
  PrizePool prize_pool = 1; //活动奖品池，某活动中的奖品信息-信息
}

message PutPrizePoolReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 activity_id = 3; //活动id
  int64 prize_id = 4; //奖品id
  int64 grade_id = 5; //奖品等级
  int64 luck_value = 6; //幸运值
  int64 status = 7; //是否可用，0不可用，1可用
  int64 total = 8; //奖品总数量
  int64 remainder = 9; //奖品剩余数量
}

message PutPrizePoolResp {
}

message DelPrizePoolReq {
  int64 id = 1; //PrizePool ID
}

message DelPrizePoolResp {
}

message GetPrizePoolByIdReq {
  int64 id = 1; //PrizePool ID
}

message GetPrizePoolByIdResp {
  PrizePool prize_pool = 1; //活动奖品池，某活动中的奖品信息(prize_pool)
}

message GetPrizePoolListReq {
  ListReq list_req = 1; //列表页码参数
  PrizePool prize_pool = 2; //PrizePool参数
}

message GetPrizePoolListResp {
  repeated PrizePool prize_pools = 1; //prize_pool
  int64 total = 2; //总数量
}

message GetPrizePoolEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---项目---
message Project {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //项目名称
  int64 status = 4; //项目状态
  int64 create_at = 5; //创建日期
  int64 update_at = 6; //更新时间
}

message AddProjectReq {
  string name = 1; //项目名称
  int64 status = 2; //项目状态
}

message AddProjectResp {
  Project project = 1; //项目-信息
}

message PutProjectReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //项目名称
  int64 status = 4; //项目状态
}

message PutProjectResp {
}

message DelProjectReq {
  int64 id = 1; //Project ID
}

message DelProjectResp {
}

message GetProjectByIdReq {
  int64 id = 1; //Project ID
}

message GetProjectByIdResp {
  Project project = 1; //项目(project)
}

message GetProjectListReq {
  ListReq list_req = 1; //列表页码参数
  Project project = 2; //Project参数
}

message GetProjectListResp {
  repeated Project projects = 1; //project
  int64 total = 2; //总数量
}

message GetProjectEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---用户名单---
message User {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string passport = 3; //凭证，可以是手机号或者社交账号，一般是由客户填入
  string email = 4; //邮箱
  string phone = 5; //手机号
  string name = 6; //用户名
  string address = 7; //收货地址
  int64 score = 8; //积分
  int64 status = 9; //状态:0未授权，1正常，2已冻结
  int64 create_at = 10; //创建时间
  int64 update_at = 11; //更新时间
}

message AddUserReq {
  string passport = 1; //凭证，可以是手机号或者社交账号，一般是由客户填入
  string email = 2; //邮箱
  string phone = 3; //手机号
  string name = 4; //用户名
  string address = 5; //收货地址
  int64 score = 6; //积分
  int64 status = 7; //状态:0未授权，1正常，2已冻结
}

message AddUserResp {
  User user = 1; //用户名单-信息
}

message PutUserReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string passport = 3; //凭证，可以是手机号或者社交账号，一般是由客户填入
  string email = 4; //邮箱
  string phone = 5; //手机号
  string name = 6; //用户名
  string address = 7; //收货地址
  int64 score = 8; //积分
  int64 status = 9; //状态:0未授权，1正常，2已冻结
}

message PutUserResp {
}

message DelUserReq {
  int64 id = 1; //User ID
}

message DelUserResp {
}

message GetUserByIdReq {
  int64 id = 1; //User ID
}

message GetUserByIdResp {
  User user = 1; //用户名单(user)
}

message GetUserListReq {
  ListReq list_req = 1; //列表页码参数
  User user = 2; //User参数
}

message GetUserListResp {
  repeated User users = 1; //user
  int64 total = 2; //总数量
}

message GetUserEnumsReq {
  int64 parent_id = 1; //父级ID
}

//---活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理---
message UserPool {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 activity_id = 3; //活动id
  int64 user_id = 4; //用户id
  int64 status = 5; //状态:0未授权，1正常，2已冻结
  int64 score = 6; //用户在当前活动的积分
  int64 create_at = 7; //创建时间
  int64 update_at = 8; //更新时间
}

message AddUserPoolReq {
  int64 activity_id = 1; //活动id
  int64 user_id = 2; //用户id
  int64 status = 3; //状态:0未授权，1正常，2已冻结
  int64 score = 4; //用户在当前活动的积分
}

message AddUserPoolResp {
  UserPool user_pool = 1; //活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理-信息
}

message PutUserPoolReq {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 activity_id = 3; //活动id
  int64 user_id = 4; //用户id
  int64 status = 5; //状态:0未授权，1正常，2已冻结
  int64 score = 6; //用户在当前活动的积分
}

message PutUserPoolResp {
}

message DelUserPoolReq {
  int64 id = 1; //UserPool ID
}

message DelUserPoolResp {
}

message GetUserPoolByIdReq {
  int64 id = 1; //UserPool ID
}

message GetUserPoolByIdResp {
  UserPool user_pool = 1; //活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理(user_pool)
}

message GetUserPoolListReq {
  ListReq list_req = 1; //列表页码参数
  UserPool user_pool = 2; //UserPool参数
}

message GetUserPoolListResp {
  repeated UserPool user_pools = 1; //user_pool
  int64 total = 2; //总数量
}

message GetUserPoolEnumsReq {
  int64 parent_id = 1; //父级ID
}



//------ custom message start ------

message LuckyDetail {
  //中奖信息
  Lucky lucky = 1;

  //中奖用户信息
  User user = 2;

  //奖品池信息
  PrizePool prize_pool = 3;

  //活动信息
  Activity activity = 4;

  //奖品信息
  Prize prize = 5;

  //奖品级别
  PrizeGrade prize_grade = 6;

  //项目信息
  Project project = 7;
}


message JwtData {
  int64 user_id = 1;
  string ip = 2;
  string platform = 3;
}
message JwtToken {
  string access_token = 1;
  int64 access_expire = 2;
}

message IdentifyReq {
  string passport = 1;
  JwtData jwt_data = 2;
}

message IdentifyResp {
  bool status = 1;
  JwtToken jwt_token = 2;
}

//公开的请求，幸运抽奖请求
message luckyDrawReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  string ip = 4; //IP地址，由网关提供
}

//幸运抽奖响应
message luckyDrawResp {
  User user = 1; //中奖用户
  LuckyDetail lucky_detail = 2; //中奖信息
}

// 获取用户中奖名单请求，传入其中一值即可
message GetUserLuckyDetailReq {
  string passport = 1;  // 用户账号，优先级 1
  string user_uuid = 2;  // 用户uuid，优先级 2
  int64 user_id = 3; // 用户id，优先级 3
}

// 获取用户中奖名单响应
message GetUserLuckyDetailResp {
  User user = 1; //中奖用户
  repeated LuckyDetail lucky_details = 2;
}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
message SelectPrizesReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  repeated string lucky_uuids = 4; //所选择中奖名单UUID
}

message SelectPrizesResp {
  repeated Prize prizes = 1;
}

message GenerateTokenReq {
  JwtData jwt_data = 1;
}

message GenerateTokenResp {
  JwtToken jwt_token = 2;
}

//获取活动详细请求
message GetActivityDetailReq{
  int64 activity_id = 1;
}

//活动奖品
message ActivityPrize {
  Prize prize = 1;
  PrizePool prize_pool = 2;
  PrizeGrade prize_grade = 3;
}

//活动详细
message ActivityDetail {
  Activity activity = 1;
  repeated ActivityPrize activity_prizes = 2;
}

//活动详细响应
message GetActivityDetailResp{
  ActivityDetail activity_detail = 1;
}

message GetUserDetailReq {
  int64 user_id = 1;
}

//用户活动
message UserActivity {
  Activity activity = 1;
  UserPool user_pool = 2;
}

//每个用户的信息，包含参与的活动信息
message UserDetail {
  User user = 1;
  repeated UserActivity user_activities = 2;
}

message GetUserDetailResp {
  UserDetail user_detail = 1;
}

message GetUserDetailsReq {
  ListReq list_req = 1; //列表参数
  User user = 2; //User参数
}

//用户详细列表
message GetUserDetailsResp {
  repeated UserDetail user_details = 1;
  int64 total = 2;
}

// 通过关键词查找用户请求【精确查找】
message GetUserByKeywordReq {
  string keyword = 1; //关键词
}

// 通过关键词查找用户响应【精确查找】
message GetUserByKeywordResp {
  User user = 1;
}

// 通过关键词查找用户请求【模糊查找】
message GetUsersByKeywordReq {
  ListReq list_req = 1; //列表参数
}

// 通过关键词查找用户响应【模糊查找】
message GetUsersByKeywordResp {
  repeated User users = 1;
  int64 total = 2;
}



//请求项目详细
message GetProjectDetailReq {
  int64 project_id = 1;
}

//项目详细
message ProjectDetail {
  Project project = 1;
  repeated Activity activities = 2;
}

message GetProjectDetailResp {
  ProjectDetail project_detail = 1;
}

message GetProjectDetailsReq {
  ListReq list_req = 1; //列表参数
  Project project = 2; //Project参数
}

//多条详细数据响应
message GetProjectDetailsResp {
  repeated ProjectDetail project_details = 1;
  int64 total = 2;
}

message GetActivityDetailsReq {
  ListReq list_req = 1; //列表参数
  Activity activity = 2; //Activity参数
}

message GetActivityDetailsResp {
  repeated ActivityDetail activity_details = 1;
  int64 total = 2;
}

message GetActivityPrizePoolReq {
  int64 activity_id = 1;
}

message GetActivityPrizePoolResp {
  repeated PrizePool prize_pools = 1;
}

//公开的请求
message  GetActivityPrizesReq {
  string activity_uuid = 1; //由客户端提交
  int64 activity_id = 2; //活动ID，与uuid两者二选一
}

message  GetActivityPrizesResp {
  repeated ActivityPrize activity_prizes = 1;
}

// 获取某用户在某活动中的中奖详细请求
message  GetUALuckyDetailsReq {
  int64 user_id = 1; //从jwt中提取
  string activity_uuid = 2; //由客户端提交
  int64 activity_id = 3; //活动ID，与uuid两者二选一
}

// 获取某用户在某活动中的中奖详细响应
message  GetUALuckyDetailsResp {
  repeated LuckyDetail lucky_details = 1;
  int64 total = 2;
}

// 获取某活动的中奖详细列表请求
message GetALuckyDetailsReq {
  ListReq list_req = 1;  //列表参数
  Lucky lucky = 2;  //lucky表字段
  //other表字段
  string user_name = 3;
  int64 project_id = 4;
  int64 activity_id = 5;
  string activity_name = 6;
  int64 prize_id = 7;
  string prize_name = 8;
  int64 prize_grade_id = 9;
}

// 获取某活动的中奖详细列表响应
message  GetALuckyDetailsResp {
  repeated LuckyDetail lucky_details = 1;
  int64 total = 2;
}

message GetProjectActivitiesReq {
  int64 project_id = 1;
}

message GetProjectActivitiesResp {
  repeated Activity activities = 1;
}

// 获取某用户可参加活动的请求
message GetUserActivitiesReq {
  int64 user_id = 1;
  int64 activity = 2;
}

// 获取某用户可参加活动的响应
message GetUserActivitiesResp {
  repeated UserActivity user_activities = 1;
}

// 重置某活动的运气值，传入一个即可，由于是危险操作，所以需要同时传入 uuid 和 id
message ResetActivityLuckValueReq {
  string activity_uuid = 1;
  int64 activity_id = 2;
}

//------ custom message end ------

// ------------------------------------ 
// Rpc Service
// ------------------------------------ 


//-----------------------luckydraw service----------------------- 
service luckydraw { 

  //-----------------------Activity(活动) func----------------------- 

  rpc BaseAddActivity(AddActivityReq) returns(AddActivityResp); 
  rpc BasePutActivity(PutActivityReq) returns(PutActivityResp); 
  rpc BaseDelActivity(DelActivityReq) returns(DelActivityResp); 
  rpc BaseGetActivityById(GetActivityByIdReq) returns(GetActivityByIdResp); 
  rpc BaseGetActivityList(GetActivityListReq) returns(GetActivityListResp); 
  rpc BaseGetActivityEnums(GetActivityEnumsReq) returns(GetEnumsResp); 

  //-----------------------Lucky(中奖名单) func----------------------- 

  rpc BaseAddLucky(AddLuckyReq) returns(AddLuckyResp); 
  rpc BasePutLucky(PutLuckyReq) returns(PutLuckyResp); 
  rpc BaseDelLucky(DelLuckyReq) returns(DelLuckyResp); 
  rpc BaseGetLuckyById(GetLuckyByIdReq) returns(GetLuckyByIdResp); 
  rpc BaseGetLuckyList(GetLuckyListReq) returns(GetLuckyListResp); 
  rpc BaseGetLuckyEnums(GetLuckyEnumsReq) returns(GetEnumsResp); 

  //-----------------------Prize(奖品名单) func----------------------- 

  rpc BaseAddPrize(AddPrizeReq) returns(AddPrizeResp); 
  rpc BasePutPrize(PutPrizeReq) returns(PutPrizeResp); 
  rpc BaseDelPrize(DelPrizeReq) returns(DelPrizeResp); 
  rpc BaseGetPrizeById(GetPrizeByIdReq) returns(GetPrizeByIdResp); 
  rpc BaseGetPrizeList(GetPrizeListReq) returns(GetPrizeListResp); 
  rpc BaseGetPrizeEnums(GetPrizeEnumsReq) returns(GetEnumsResp); 

  //-----------------------PrizeGrade(奖品级别) func----------------------- 

  rpc BaseAddPrizeGrade(AddPrizeGradeReq) returns(AddPrizeGradeResp); 
  rpc BasePutPrizeGrade(PutPrizeGradeReq) returns(PutPrizeGradeResp); 
  rpc BaseDelPrizeGrade(DelPrizeGradeReq) returns(DelPrizeGradeResp); 
  rpc BaseGetPrizeGradeById(GetPrizeGradeByIdReq) returns(GetPrizeGradeByIdResp); 
  rpc BaseGetPrizeGradeList(GetPrizeGradeListReq) returns(GetPrizeGradeListResp); 
  rpc BaseGetPrizeGradeEnums(GetPrizeGradeEnumsReq) returns(GetEnumsResp); 

  //-----------------------PrizePool(活动奖品池，某活动中的奖品信息) func----------------------- 

  rpc BaseAddPrizePool(AddPrizePoolReq) returns(AddPrizePoolResp); 
  rpc BasePutPrizePool(PutPrizePoolReq) returns(PutPrizePoolResp); 
  rpc BaseDelPrizePool(DelPrizePoolReq) returns(DelPrizePoolResp); 
  rpc BaseGetPrizePoolById(GetPrizePoolByIdReq) returns(GetPrizePoolByIdResp); 
  rpc BaseGetPrizePoolList(GetPrizePoolListReq) returns(GetPrizePoolListResp); 
  rpc BaseGetPrizePoolEnums(GetPrizePoolEnumsReq) returns(GetEnumsResp); 

  //-----------------------Project(项目) func----------------------- 

  rpc BaseAddProject(AddProjectReq) returns(AddProjectResp); 
  rpc BasePutProject(PutProjectReq) returns(PutProjectResp); 
  rpc BaseDelProject(DelProjectReq) returns(DelProjectResp); 
  rpc BaseGetProjectById(GetProjectByIdReq) returns(GetProjectByIdResp); 
  rpc BaseGetProjectList(GetProjectListReq) returns(GetProjectListResp); 
  rpc BaseGetProjectEnums(GetProjectEnumsReq) returns(GetEnumsResp); 

  //-----------------------User(用户名单) func----------------------- 

  rpc BaseAddUser(AddUserReq) returns(AddUserResp); 
  rpc BasePutUser(PutUserReq) returns(PutUserResp); 
  rpc BaseDelUser(DelUserReq) returns(DelUserResp); 
  rpc BaseGetUserById(GetUserByIdReq) returns(GetUserByIdResp); 
  rpc BaseGetUserList(GetUserListReq) returns(GetUserListResp); 
  rpc BaseGetUserEnums(GetUserEnumsReq) returns(GetEnumsResp); 

  //-----------------------UserPool(活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理) func----------------------- 

  rpc BaseAddUserPool(AddUserPoolReq) returns(AddUserPoolResp); 
  rpc BasePutUserPool(PutUserPoolReq) returns(PutUserPoolResp); 
  rpc BaseDelUserPool(DelUserPoolReq) returns(DelUserPoolResp); 
  rpc BaseGetUserPoolById(GetUserPoolByIdReq) returns(GetUserPoolByIdResp); 
  rpc BaseGetUserPoolList(GetUserPoolListReq) returns(GetUserPoolListResp); 
  rpc BaseGetUserPoolEnums(GetUserPoolEnumsReq) returns(GetEnumsResp); 

  //------ custom service start ------

  // 抽奖凭证校验，验证用户身份，颁发jwt
  rpc UserIdentify (IdentifyReq) returns (IdentifyResp);

  // 抽奖接口
  rpc luckyDraw (luckyDrawReq) returns (luckyDrawResp);

  // 用户确认认领奖品名单，记得把剩余的改为弃领状态
  rpc SelectPrizes (SelectPrizesReq) returns (SelectPrizesResp);

  // 生产jwtToken
  rpc GenerateToken (GenerateTokenReq) returns (GenerateTokenResp);

  // 活动规则枚举
  rpc GetActivityPatternEnums (NilReq) returns (GetEnumsResp);
  // 获取每个项目及其包含的活动
  rpc GetProjectTreeOptions (NilReq) returns (TreeOptions);

  //project

  // 获取项目详细
  rpc GetProjectDetail (GetProjectDetailReq) returns (GetProjectDetailResp);
  // 获取项目详细列表
  rpc GetProjectDetails (GetProjectDetailsReq) returns (GetProjectDetailsResp);

  //activity

  // 获取活动详细
  rpc GetActivityDetail (GetActivityDetailReq) returns (GetActivityDetailResp);
  // 获取活动详细列表
  rpc GetActivityDetails (GetActivityDetailsReq) returns (GetActivityDetailsResp);
  // 某项目的活动列表
  rpc GetProjectActivities (GetProjectActivitiesReq) returns (GetProjectActivitiesResp);
  // 某用户可参与的活动列表
  rpc GetUserActivities (GetUserActivitiesReq) returns (GetUserActivitiesResp);

  //prize

  // 获取某活动的奖品列表
  rpc GetActivityPrizes (GetActivityPrizesReq) returns (GetActivityPrizesResp);

  //prize pool

  // 获取某活动的奖品池
  rpc GetActivityPrizePool (GetActivityPrizePoolReq) returns (GetActivityPrizePoolResp);
  // 重置某活动奖品池的奖品运气值
  rpc ResetActivityLuckValue (ResetActivityLuckValueReq) returns (StatusResp);

  // 获取用户详细
  rpc GetUserDetail (GetUserDetailReq) returns (GetUserDetailResp);
  // 获取用户详细列表
  rpc GetUserDetails (GetUserDetailsReq) returns (GetUserDetailsResp);
  // 通过关键词查找用户【精确查找】，关键词可以是电话、邮箱、账号
  rpc GetUserByKeyword (GetUserByKeywordReq) returns (GetUserByKeywordResp);
  // 通过关键词查找用户【模糊查找】，关键词可以是电话、邮箱、账号、姓名等等
  rpc GetUsersByKeyword (GetUsersByKeywordReq) returns (GetUsersByKeywordResp);

  // 获取某活动的中奖详细列表
  rpc GetALuckyDetails (GetALuckyDetailsReq) returns (GetALuckyDetailsResp);
  // 获取某用户在某活动中的中奖详细列表
  rpc GetUALuckyDetails (GetUALuckyDetailsReq) returns (GetUALuckyDetailsResp);
  // 查询某用户的中奖信息
  rpc GetUserLuckyDetail (GetUserLuckyDetailReq) returns (GetUserLuckyDetailResp);

  //------ custom service end ------
}
