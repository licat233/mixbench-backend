  rpc PutProject(PutProjectReq) returns(PutProjectResp); 
  rpc DelProject(DelProjectReq) returns(DelProjectResp); 
  rpc GetProjectById(GetProjectByIdReq) returns(GetProjectByIdResp); 
  rpc SearchProject(SearchProjectReq) returns(SearchProjectResp); 
  rpc GetProjectList(GetProjectListReq) returns(GetProjectListResp); 
  rpc GetProjectEnum(GetProjectEnumReq) returns(GetEnumResp); 

  //-----------------------User(用户名单) func----------------------- 
  rpc AddUser(AddUserReq) returns(AddUserResp); 
  rpc UpdateUser(UpdateUserReq) returns(UpdateUserResp); 
  rpc PutUser(PutUserReq) returns(PutUserResp); 
  rpc DelUser(DelUserReq) returns(DelUserResp); 
  rpc GetUserById(GetUserByIdReq) returns(GetUserByIdResp); 
  rpc SearchUser(SearchUserReq) returns(SearchUserResp); 
  rpc GetUserList(GetUserListReq) returns(GetUserListResp); 
  rpc GetUserEnum(GetUserEnumReq) returns(GetEnumResp); 

  //-----------------------UserPool(活动用户池，可以参与该活动抽奖的用户，及其在该活动中的积分管理) func----------------------- 
  rpc AddUserPool(AddUserPoolReq) returns(AddUserPoolResp); 
  rpc UpdateUserPool(UpdateUserPoolReq) returns(UpdateUserPoolResp); 
  rpc PutUserPool(PutUserPoolReq) returns(PutUserPoolResp); 
  rpc DelUserPool(DelUserPoolReq) returns(DelUserPoolResp); 
  rpc GetUserPoolById(GetUserPoolByIdReq) returns(GetUserPoolByIdResp); 
  rpc SearchUserPool(SearchUserPoolReq) returns(SearchUserPoolResp); 
  rpc GetUserPoolList(GetUserPoolListReq) returns(GetUserPoolListResp); 
  rpc GetUserPoolEnum(GetUserPoolEnumReq) returns(GetEnumResp); 


}



message LuckyDetail {
  //幸运者信息
  Lucky lucky = 1;

  //奖品池信息
  PrizePool prize_pool = 2;

  //活动信息
  Activity activity = 3;

  //奖品信息
  Prize prize = 4;

  //奖品等级
  PrizeGrade prize_grade = 5;
}

//公开的请求
message  ActivePrizesReq {
  string activity_uuid = 1; //由客户端提交
}

message  ActivePrizesResp {
  repeated Prize prizes = 1;
}

message  GetLuckyDetailListReq {
  int64 user_id = 1; //从jwt中提取
  string activity_uuid = 2; //由客户端提交
}

message  GetLuckyDetailListResp {
  repeated LuckyDetail lucky_details = 1;
}


message JwtData {
  int64 user_id = 1;
  string ip = 2;
  string platform = 3;
}
message JwtToken {
  string access_token = 1;
  int64 access_expire = 2;
}

message IdentifyReq {
  string passport = 1;
  JwtData jwt_data = 2;
}

message IdentifyResp {
  bool status = 1;
  JwtToken jwt_token = 2;
}

//公开的请求，开始抽奖
message GoodluckReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  string ip = 4; //IP地址，由网关提供
}

message GoodluckResp {
  User user = 1; //中奖用户
  LuckyDetail lucky_detail = 2; //中奖信息
}

message SearchLuckyDetailReq {
  string passport = 1;
}

message SearchLuckyDetailResp {
  User user = 1; //中奖用户
  repeated LuckyDetail lucky_details = 2;
}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
message SelectPrizesReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  repeated string lucky_uuids = 4; //所选择中奖名单UUID
}

message SelectPrizesResp {
  repeated Prize prizes = 1;
}

message GenerateTokenReq {
  JwtData jwt_data = 1;
}

message GenerateTokenResp {
  JwtToken jwt_token = 2;
}

service Core {
  //获取某活动的奖品
  rpc GetActivePrizes (ActivePrizesReq) returns (ActivePrizesResp);
  
  //查询某用户在某活动里的中奖详细名单
  rpc GetLuckyDetailList (GetLuckyDetailListReq) returns (GetLuckyDetailListResp);

  //抽奖凭证校验，验证用户身份，颁发jwt
  rpc Identify (IdentifyReq) returns (IdentifyResp);

  //抽取奖品
  rpc Goodluck (GoodluckReq) returns (GoodluckResp);

  //根据passport查询用户的中奖信息
  rpc SearchLuckyDetail (SearchLuckyDetailReq) returns (SearchLuckyDetailResp);

  //用户确认认领奖品名单，记得把剩余的改为弃领状态
  rpc SelectPrizes (SelectPrizesReq) returns (SelectPrizesResp);

  //生产jwtToken
  rpc GenerateToken (GenerateTokenReq) returns (GenerateTokenResp);
}
