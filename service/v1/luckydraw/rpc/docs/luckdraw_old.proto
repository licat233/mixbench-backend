//---活动---
message Activity {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  string name = 3; //活动名称
  int64 project_id = 4; //项目id
  int64 status = 5; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 6; //方案: 0会员制，1公开制，2会员需授权
  int64 max_count = 7; //最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 8; //最大抽奖次数：-1表示无限制，0表示不可中奖
  int64 start_time = 9; //活动开始时间
  int64 end_time = 10; //活动结束时间
  int64 create_at = 11; //创建时间
  int64 update_at = 12; //更新时间
}

