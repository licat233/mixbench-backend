  rpc AddActivity(AddActivityReq) returns(AddActivityResp); 
  rpc UpdateActivity(UpdateActivityReq) returns(UpdateActivityResp); 
  rpc PutActivity(PutActivityReq) returns(PutActivityResp); 
  rpc DelActivity(DelActivityReq) returns(DelActivityResp); 
  rpc GetActivityById(GetActivityByIdReq) returns(GetActivityByIdResp); 
  rpc SearchActivity(SearchActivityReq) returns(SearchActivityResp); 
  rpc GetActivityList(GetActivityListReq) returns(GetActivityListResp); 
  rpc GetActivityEnum(GetActivityEnumReq) returns(GetEnumResp); 

  //-----------------------Goods(商品) func----------------------- 
