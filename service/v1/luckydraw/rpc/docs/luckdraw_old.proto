//---商品---
message Goods {
  int64 id = 1; //表主键
  string uuid = 2; //唯一识别码
  int64 category_id = 3; //分类id
  string goods_sn = 4; //商品的唯一货号
  string name = 5; //商品名
  string keywords = 6; //关键词
  string goods_desc = 7; //商品描述
  string goods_thumb = 8; //商品缩略图，用于在列表或搜索结果中预览显示
  string goods_banner_imgs = 9; //商品轮播图地址
  string goods_tip = 10; //商品提示
  double goods_price = 11; //商品价格
  int64 goods_score = 12; //商品积分
  int64 remain_count = 13; //剩余数量
  int64 month_sell_count = 14; //月销量
  int64 total_sell_count = 15; //总销量
  int64 comment_count = 16; //累计评论数
  int64 is_real = 17; //真实商品？
  int64 is_on_sale = 18; //正在打折？
  int64 is_alone_sale = 19; //是否能单独销售？如果不能单独销售，则只能作为某商品的配件或者赠品销售
  int64 is_best = 20; //最精品？
  int64 is_new = 21; //最新的？
  int64 is_hot = 22; //热门的？
  string seller_note = 23; //卖方发票抬头
  string shop_name = 24; //店铺名称
  string tag = 25; //标签
  int64 status = 26; //状态:0下架，1上架，2预售
  int64 create_at = 27; //创建时间
  int64 update_at = 28; //更新时间
}

