syntax = "proto3";

package luckdraw_proto;

option go_package = "./luckdraw_pb";

message User {
  int64 id = 1;
  string uuid = 2;
  string passport = 3;
  string email = 4;
  string phone = 5;
  string name = 6;
  string address = 7;
  int64 score = 8;
  int64 status = 9;
}

message Prize {
  int64 id = 1;
  string uuid = 2;
  string name = 3;
  string image = 4;
  double price = 5;
  int64 status = 6;
}

message Activity {
  int64   id = 1;
  string uuid = 2;
  string name = 3;
  int64 project_id = 4;
  bool status = 5; //活动状态，是否在举办，默认关闭，需手动开启
  int64 pattern = 6; //方案: 0私密的，1公开的
  int64 max_count = 7; //最大抽奖次数：-1表示无限制，0表示不可抽奖
  int64 max_prizes = 8; //最大领奖数:  -1表示无限制，0表示不可领奖
  int64 start_time = 9; //活动开始时间
  int64 end_time = 10; //活动结束时间
}

message Lucker {
  int64   id = 1;
  string uuid = 2;
  int64 user_id = 3;
  int64 prizes_pool_id = 4;
  int64 status = 5;
  int64 luck_date = 6;
  string ip = 7;
}

message PrizesPool {
  int64   id = 1;
  string uuid = 2;
  int64 activity_id = 3;
  int64 prize_id = 4;
  int64 luck_value = 5;
  int64 status = 6;
  int64 grade_id = 7;
  int64 number = 8;
  int64 remainder = 9;
}

message UsersPool {
  int64   id = 1;
  string uuid = 2;
  int64 activity_id = 3;
  int64 user_id = 4;
  int64 status = 5;
  int64 score = 6;
}

message PrizeGrade {
  int64   id = 1;
  string  name = 2;
  int64   iswin = 3;
}

message LuckerDetail {
  //幸运者信息
  Lucker lucker = 1;

  //奖品池信息
  PrizesPool prizes_pool = 2;

  //活动信息
  Activity activity = 3;

  //奖品信息
  Prize prize = 4;

  //奖品等级
  PrizeGrade prize_grade = 5;
}

//公开的请求
message  ActivePrizesReq {
  string activity_uuid = 1; //由客户端提交
}

message  ActivePrizesResp {
  repeated Prize prizes = 1;
}

message  GetLuckerListReq {
  int64 user_id = 1; //从jwt中提取
  string activity_uuid = 2; //由客户端提交
}

message  GetLuckerListResp {
  repeated LuckerDetail lucker_details = 1;
}


message JwtData {
  int64 user_id = 1;
  string ip = 2;
  string platform = 3;
}
message JwtToken {
  string access_token = 1;
  int64 access_expire = 2;
}

message IdentifyReq {
  string passport = 1;
  JwtData jwt_data = 2;
}

message IdentifyResp {
  bool status = 1;
  JwtToken jwt_token = 2;
}

//公开的请求，开始抽奖
message GoodluckReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  string ip = 4; //IP地址，由网关提供
}

message GoodluckResp {
  User user = 1; //中奖用户
  LuckerDetail lucker_detail = 2; //中奖信息
}

message SearchLuckerReq {
  string passport = 1;
}

message SearchLuckerResp {
  User user = 1; //中奖用户
  repeated LuckerDetail lucker_details = 2;
}

message SelectPrizesReq {
  int64 user_id = 1; //从jwt中提取
  int64 activity_id = 2; // 活动id，需要传入活动id，用于查询redis缓存
  string activity_uuid = 3; //由客户端提交
  repeated string lucker_uuids = 4; //所选择中奖名单UUID
}

message SelectPrizesResp {
  repeated Prize prizes = 1;
}

message GenerateTokenReq {
  JwtData jwt_data = 1;
}

message GenerateTokenResp {
  JwtToken jwt_token = 2;
}

service Luckdraw {
  //获取某活动的奖品
  rpc GetActivePrizes (ActivePrizesReq) returns (ActivePrizesResp);
  
  //查询某用户在某活动里的中奖名单
  rpc GetLuckerList (GetLuckerListReq) returns (GetLuckerListResp);

  //抽奖凭证校验，验证用户身份，颁发jwt
  rpc Identify (IdentifyReq) returns (IdentifyResp);

  //抽取奖品
  rpc Goodluck (GoodluckReq) returns (GoodluckResp);

  //根据passport查询用户的中奖信息
  rpc SearchLucker (SearchLuckerReq) returns (SearchLuckerResp);

  //用户确认认领奖品名单，记得把剩余的改为弃领状态
  rpc SelectPrizes (SelectPrizesReq) returns (SelectPrizesResp);

  //生产jwtToken
  rpc GenerateToken (GenerateTokenReq) returns (GenerateTokenResp);
}
