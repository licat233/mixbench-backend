Name: captcha-api
Host: 0.0.0.0
Port: ${CAPTCHA_API_PORT}

Mode: ${SERVICE_MODE}
Debug: ${SERVICE_DEBUG}

Log:
  ServiceName: captcha-api
  Level: error

RootDir: ./

#静态资源服务配置
StaticConfig:
  Domain: ${STATIC_HOST}
  Root: ${STATIC_ROOT}

#监控
Prometheus:
  Host: 0.0.0.0
  Port: ${PROMETHEUS_CAPTCHA_API_PORT}
  Path: /metrics

#链路追踪
Telemetry:
  Name: captcha-api
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

CaptchaRpc:
  Endpoints:
    - 127.0.0.1:${CAPTCHA_RPC_PORT}
  NonBlock: true

AdminRpc:
  Endpoints:
    - 127.0.0.1:${ADMIN_RPC_PORT}
  NonBlock: true

Redis:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASSWORD}
  Type: node
  DB: 1
