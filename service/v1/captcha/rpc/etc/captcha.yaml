Name: captcha-rpc
ListenOn: 127.0.0.1:${CAPTCHA_RPC_PORT}

Mode: ${SERVICE_MODE}
Debug: ${SERVICE_DEBUG}

# Etcd:
#   Hosts:
#     - 127.0.0.1:2379
#   Key: captcha.rpc

Redis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASSWORD}
  Type: node

Log:
  ServiceName: captcha-rpc
  Level: error

#监控
Prometheus:
  Host: 0.0.0.0
  Port: ${PROMETHEUS_CAPTCHA_RPC_PORT}
  Path: /metrics

#链路追踪
Telemetry:
  Name: captcha-rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

