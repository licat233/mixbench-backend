version: "3.9"
# 网络配置
networks:
  backend_net:
    driver: ${NETWORKS_DRIVER}
# 数据卷
volumes:
  data_volume: {}
  build_volume: {}
  mysql_volume: {}
  redis_volume: {}
  nginx_volume: {}
  zookeeper_data_volume: {}
  zookeeper_log_volume: {}
  zookeeper_logs_volume: {}
  zookeeper_datalog_volume: {}
  kafka_volume: {}
  elasticsearch_data_volume: {}
  elasticsearch_logs_volume: {}
  elasticsearch_plugins_volume: {}
  grafana_volume: {}
  prometheus_volume: {}
  jaeger_volume: {}
  static_volume: {}
  www_volume: {}

# 服务容器配置
services:
  # mixbench服务
  mixbench:
    build:
      context: .
    hostname: mixbench
    container_name: mixbench
    environment:
      - TZ=${TZ}
      - GOPROXY=https://goproxy.cn,direct
      - BACKEND_HOST=${BACKEND_HOST}
      - STATIC_HOST=${STATIC_HOST}
      - SERVICE_MODE=${SERVICE_MODE}
      - SERVICE_DEBUG=${SERVICE_DEBUG}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_CONN_OPTIONS=${MYSQL_CONN_OPTIONS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_API_PORT=${ADMIN_API_PORT}
      - ADMIN_RPC_PORT=${ADMIN_RPC_PORT}
      - CAPTCHA_API_PORT=${CAPTCHA_API_PORT}
      - CAPTCHA_RPC_PORT=${CAPTCHA_RPC_PORT}
      - LUCKDRAW_API_PORT=${LUCKDRAW_API_PORT}
      - LUCKDRAW_RPC_PORT=${LUCKDRAW_RPC_PORT}
      - LUCKDRAW_MQ_PORT=${LUCKDRAW_MQ_PORT}
    volumes:
      - .:/go/mixbench
      - build_volume:/go/mixbench/build
      - static_volume:/go/mixbench/static
    working_dir: /go/mixbench
    restart: on-failure
    privileged: true
    stdin_open: true # 打开标准输入，可以接受外部输入
    tty: true
    networks:
      - backend_net

  # 数据卷容器，数据中心
  datacenter:
    image: ubuntu:latest
    hostname: datacenter
    container_name: mixbench_data
    restart: on-failure
    privileged: true
    stdin_open: true
    volumes:
      - data_volume:/data_v
      - build_volume:/data_v/build
      - mysql_volume:/data_v/mysql
      - redis_volume:/data_v/redis
      - nginx_volume:/data_v/nginx
      - zookeeper_data_volume:/data_v/zookeeper/data
      - zookeeper_log_volume:/data_v/zookeeper/log
      - zookeeper_logs_volume:/data_v/zookeeper/logs
      - zookeeper_datalog_volume:/data_v/zookeeper/datalog
      - kafka_volume:/data_v/kafka
      - elasticsearch_data_volume:/data_v/elasticsearch/data
      - elasticsearch_logs_volume:/data_v/elasticsearch/logs
      - elasticsearch_plugins_volume:/data_v/elasticsearch/plugins
      - grafana_volume:/data_v/grafana
      - prometheus_volume:/data_v/prometheus
      - jaeger_volume:/data_v/jaeger
      - static_volume:/data_v/static
      - www_volume:/data_v/www
    networks:
      - backend_net

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: mixbench_filebrowser
    hostname: filebrowser
    restart: on-failure
    expose:
      - 80
    volumes:
      - data_volume:/srv
      - build_volume:/srv/build
      - mysql_volume:/srv/mysql
      - redis_volume:/srv/redis
      - nginx_volume:/srv/nginx
      - zookeeper_data_volume:/srv/zookeeper/data
      - zookeeper_log_volume:/srv/zookeeper/log
      - zookeeper_logs_volume:/srv/zookeeper/logs
      - zookeeper_datalog_volume:/srv/zookeeper/datalog
      - kafka_volume:/srv/kafka
      - elasticsearch_data_volume:/srv/elasticsearch/data
      - elasticsearch_logs_volume:/srv/elasticsearch/logs
      - elasticsearch_plugins_volume:/srv/elasticsearch/plugins
      - grafana_volume:/srv/grafana
      - prometheus_volume:/srv/prometheus
      - jaeger_volume:/srv/jaeger
      - static_volume:/srv/static
      - ./deploy/nginx/www:/srv/www
    networks:
      - backend_net
    depends_on:
      - datacenter

  # Nginx服务
  nginx:
    image: nginx:latest
    hostname: nginx
    container_name: mixbench_nginx
    restart: on-failure
    privileged: true
    environment:
      - TZ=${TZ}
      - BACKEND_HOST=${BACKEND_HOST}
      - STATIC_HOST=${STATIC_HOST}
      - DEV_HOST=${DEV_HOST}
      - ADMIN_API_PORT=${ADMIN_API_PORT}
      - ADMIN_RPC_PORT=${ADMIN_RPC_PORT}
      - CAPTCHA_API_PORT=${CAPTCHA_API_PORT}
      - CAPTCHA_RPC_PORT=${CAPTCHA_RPC_PORT}
      - LUCKDRAW_API_PORT=${LUCKDRAW_API_PORT}
      - LUCKDRAW_RPC_PORT=${LUCKDRAW_RPC_PORT}
      - LUCKDRAW_MQ_PORT=${LUCKDRAW_MQ_PORT}
    ports:
      - ${NGINX_PORT}:80 #只需提供80端口，SSL/STL 由公网 nginx 负责
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - ./deploy/nginx/ssl:/etc/nginx/ssl
      - ./deploy/nginx/www:/www
      - nginx_volume:/var/log/nginx
      - static_volume:/static
    networks:
      - backend_net
    depends_on:
      - mixbench

  #jaeger链路追踪 — Jaeger for tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger
    container_name: mixbench_jaeger
    restart: on-failure
    # ports:
    #   # - "5775:5775/udp" #新版本已弃用
    #   - "6831:6831/udp"
    #   - "6832:6832/udp"
    #   - "5778:5778"
    #   - "16686:16686"
    #   - "14268:14268"
    #   - "9411:9411"
    expose:
      - 5775
      - 6831
      - 6832
      - 5778
      - 16686
      - 14268
      - 9411
    volumes:
      - jaeger_volume:/tmp
    environment:
      - TZ=${TZ}
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - LOG_LEVEL=debug
    networks:
      - backend_net

  #prometheus监控 — Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: mixbench_prometheus
    environment:
      - TZ=${TZ}
    volumes:
      - ./deploy/prometheus/server/prometheus.yaml:/etc/prometheus/prometheus.yaml
      # - ${DATA_DIR}/prometheus/data:/prometheus
      - prometheus_volume:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    restart: on-failure
    user: root
    # ports:
    #   - 9090:9090
    expose:
      - 9090
    networks:
      - backend_net

  #查看prometheus监控数据 - Grafana to view Prometheus monitoring data
  grafana:
    image: grafana/grafana:latest
    container_name: mixbench_grafana
    hostname: grafana
    user: root
    environment:
      - TZ=${TZ}
    restart: on-failure
    volumes:
      # - ${DATA_DIR}/grafana/data:/var/lib/grafana
      - grafana_volume:/var/lib/grafana
    expose:
      - 3000
    networks:
      - backend_net

  #搜集kafka业务日志、存储prometheus监控数据 - Kafka for collecting business logs and storing Prometheus monitoring data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: mixbench_elasticsearch
    hostname: elasticsearch
    user: root #必须以root用户启动
    environment:
      - TZ=${TZ}
      - cluster.name=mixbench_elasticsearch #设置集群名称为 mixbench_elasticsearch
      - discovery.type=single-node #以单一节点模式启动
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" #设置使用jvm内存大小
    volumes:
      # - ${DATA_DIR}/elasticsearch/data:/usr/share/elasticsearch/data
      # - ./deploy/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - elasticsearch_data_volume:/usr/share/elasticsearch/data #数据文件挂载
      - elasticsearch_logs_volume:/usr/share/elasticsearch/logs #日志文件挂载
      - elasticsearch_plugins_volume:/usr/share/elasticsearch/plugins #插件文件挂载
    restart: on-failure
    privileged: true
    expose:
      - 9200
      - 9300
    networks:
      - backend_net

  #查看elasticsearch数据 - Kibana to view Elasticsearch data
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: mixbench_kibana
    hostname: kibana
    environment:
      - TZ=${TZ}
      - elasticsearch.hosts=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    restart: on-failure
    volumes:
      - ./deploy/kibana/config:/usr/share/kibana/config
    networks:
      - backend_net
    expose:
      - 5601
    depends_on:
      - elasticsearch

  #收集业务数据到kafka中 - Collect business data
  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    container_name: mixbench_filebeat
    hostname: filebeat
    environment:
      - TZ=${TZ}
    user: root
    restart: on-failure
    entrypoint: "filebeat -e -strict.perms=false" #解决配置文件权限问题 - Solving the configuration file permissions
    volumes:
      - ./deploy/filebeat/conf/filebeat.yml:/usr/share/filebeat/filebeat.yml
      # 此处需指定docker的containers目录，取决于你docker的配置 - The containers directory of docker needs to be specified here, depending on your docker configuration
      # 如snap安装的docker，则为/var/snap/docker/common/var-lib-docker/containers - Example if docker is installed by Snap /var/snap/docker/common/var-lib-docker/containers
      # - /var/snap/docker/common/var-lib-docker/containers:/var/lib/docker/containers
      # - /var/lib/docker/containers:/var/lib/docker/containers
      - /Users/licat/Library/Containers:/var/lib/docker/containers
    networks:
      - backend_net
    depends_on:
      - kafka

  #将kafka中filebeat收集的日志数据输出到elasticsearch - The data output collected by FileBeat in Kafka is output to ES
  go-stash:
    # image: kevinwan/go-stash:latest # if you "macOs intel" or "linux amd"
    image: kevinwan/go-stash:1.0.5-arm64 #  if you "macOs m1" or "linux arm"
    container_name: mixbench_go-stash
    hostname: go-stash
    environment:
      - TZ=${TZ}
    user: root
    restart: on-failure
    volumes:
      - ./deploy/go-stash/etc:/app/etc
    networks:
      - backend_net
    depends_on:
      - elasticsearch
      - kafka

  #zookeeper是kafka的依赖 - Zookeeper is the dependencies of Kafka
  zookeeper:
    image: zookeeper:latest
    container_name: mixbench_zookeeper
    hostname: zookeeper
    environment:
      - TZ=${TZ}
    restart: on-failure
    expose:
      - 2181
    volumes:
      - zookeeper_data_volume:/data
      - zookeeper_log_volume:/log
      - zookeeper_logs_volume:/logs
      - zookeeper_datalog_volume:/datalog
    networks:
      - backend_net

  #消息队列 - Message queue
  kafka:
    image: wurstmeister/kafka:latest
    container_name: mixbench_kafka
    hostname: kafka
    expose:
      - 9092
    # ports:
    #   - 9092:9092
    environment:
      - TZ=${TZ}
      - KAFKA_BROKER_ID=0
      - KAFKA_ADVERTISED_HOST_NAME=kafka #Do not use localhost or 127.0.0.1 as the host IP
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CREATE_TOPICS=goodluck-topic:1:1,mixbench-log:1:1
    restart: on-failure
    privileged: true
    volumes:
      # - ${DATA_DIR}/kafka/data:/kafka
      - kafka_volume:/kafka
      # - /var/run/docker.sock:/var/run/docker.sock  # 使用docker.sock反而无法通信
    networks:
      - backend_net
    depends_on:
      - zookeeper

  #asynqmon asynq延迟队列、定时队列的webui - Asynqmon asynq delay queue, timing queue's webUI
  asynqmon:
    image: tantobocah/asynqmon:latest
    container_name: mixbench_asynqmon
    hostname: asynqmon
    expose:
      - 8080
    command:
      - "--redis-addr=redis:6379"
      # - "--redis-password=qC3/bZ4~hP9!"
    restart: on-failure
    networks:
      - backend_net
    depends_on:
      - redis

  #mysql数据库容器
  mysql:
    image: mysql:latest
    container_name: mixbench_mysql
    hostname: mysql
    environment:
      - TZ=${TZ}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # - MYSQL_ALLOW_EMPTY_PASSWORD=true
    expose:
      - 3306
    volumes:
      # 数据挂载 - Data mounting
      # - ${DATA_DIR}/mysql:/var/lib/mysql
      - mysql_volume:/var/lib/mysql
      - ./deploy/mysql:/home/sqlfile
      # 日志
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      # Modify the Mysql 8.0 default password strategy to the original strategy (MySQL8.0 to change its default strategy will cause the password to be unable to match)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    restart: on-failure
    networks:
      - backend_net

  #redis容器 - Redis container
  redis:
    image: redis:latest
    container_name: mixbench_redis
    hostname: redis
    expose:
      - 6379
    environment:
      - TZ=${TZ}
      # 数据文件 - data files
    volumes:
      # - ${DATA_DIR}/redis:/data
      - redis_volume:/data:rw
    privileged: true
    restart: on-failure
    networks:
      - backend_net

  #phpmyadmin
  mysql_manage:
    image: phpmyadmin:latest
    container_name: mixbench_mysqlmanage
    hostname: mysql_manage
    restart: on-failure
    expose:
      - 80
      - 8080
    environment:
      - TZ=${TZ}
      - PMA_ARBITRARY=1 #当设置为 1 连接到任意服务器将被允许
      - PMA_HOST=mysql #定义 MySQL 服务器的地址/主机名
      - PMA_PORT=3306 # 定义 MySQL 服务器的端口
      - PMA_VERBOSE=mixbench_mysql #MySQL 服务器的详细名称
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - PMA_CONTROLUSER=root
      - PMA_CONTROLPASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    networks:
      - backend_net

  #phpredisadmin
  redis_manage:
    # image: erikdubbelboer/phpredisadmin:latest # 此镜像为amd64平台，不支持arm
    image: licat/phpredisadmin:arm
    container_name: mixbench_redismanage
    hostname: redis_manage
    restart: on-failure
    expose:
      - 80
    environment:
      - TZ=${TZ}
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
      - ADMIN_USER=${REDIS_MANAGE_USERNAME} # Redis 可视化管理用户名称
      - ADMIN_PASS=${REDIS_MANAGE_PASSWORD} # Redis 可视化管理用户密码
    depends_on:
      - redis
    networks:
      - backend_net

  #kafkamanage
  kafkamanage:
    image: scjtqs/kafka-manager:latest
    container_name: mixbench_kafkamanage
    hostname: kafka_manage
    restart: on-failure
    expose:
      - 9000
    environment:
      - TZ=${TZ}
      - ZK_HOSTS=zookeeper:2181
      - APPLICATION_SECRET=${KAFKA_MANAGE_PASSWORD}
      - KM_VERSION=3.0.0.5
    depends_on:
      - zookeeper
      # - kafka
    networks:
      - backend_net
