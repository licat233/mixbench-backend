  #搜集kafka业务日志、存储prometheus监控数据 - Kafka for collecting business logs and storing Prometheus monitoring data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_elasticsearch
    hostname: elasticsearch
    volumes:
      # - ./deploy/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      # - ./deploy/elasticsearch/config/default.policy:/usr/share/elasticsearch/jdk/lib/security/default.policy
      # - ./deploy/elasticsearch/config/jvm.options:/usr/share/elasticsearch/config/jvm.options
      - elasticsearch_data_volume:/usr/share/elasticsearch/data #数据文件挂载
      - elasticsearch_logs_volume:/usr/share/elasticsearch/logs #日志文件挂载
      - elasticsearch_plugins_volume:/usr/share/elasticsearch/plugins #插件文件挂载
      # - elasticsearch_certs_volume:/usr/share/elasticsearch/config/certs #stl证书挂载
    expose:
      - 9200
      - 9300
    # ports:
    #   - 9200:9200
    environment:
      - TZ=${TZ}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" #设置使用jvm内存大小
      # - "ES_JAVA_OPTS=--enable-preview"  #启用预览 API ，以兼容Java 19
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: ${MEM_LIMIT}
    restart: on-failure
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       # "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
