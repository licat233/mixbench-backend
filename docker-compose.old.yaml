    #     ]
    #   interval: 10s
    #   timeout: 10s
    #   retries: 120
    networks:
      - backend_net
    # depends_on:
    #   elasticsearch_setup:
    #     condition: service_healthy

  #查看elasticsearch数据 - Kibana to view Elasticsearch data
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_kibana
    hostname: kibana
    environment:
      - TZ=${TZ}
      - I18N_LOCALE=zh-CN
      - SERVER_NAME=kibana
      - ELASTICSEARCH_USERNAME=kibana_admin
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://kibana.${DOMAIN}
      # - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    restart: on-failure
    mem_limit: ${MEM_LIMIT}
    volumes:
      - ./deploy/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      # - elasticsearch_certs_volume:/usr/share/kibana/config/certs
      - kibana_data_volume:/usr/share/kibana/data
    expose:
      - 5601
    depends_on:
      - elasticsearch
    # depends_on:
    #   elasticsearch:
    #     condition: service_healthy
    networks:
      - backend_net
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
    #     ]
    #   interval: 10s
    #   timeout: 10s
    #   retries: 120

# 网络配置
networks:
  backend_net:
    driver: ${NETWORKS_DRIVER}

# 数据卷
volumes:
  data_volume:
    driver: local
  build_volume:
    driver: local
  mysql_volume:
    driver: local
  redis_volume:
    driver: local
  nginx_volume:
    driver: local
  zookeeper_data_volume:
    driver: local
  zookeeper_log_volume:
    driver: local
  zookeeper_logs_volume:
    driver: local
  zookeeper_datalog_volume:
    driver: local
  kafka_volume:
    driver: local
  elasticsearch_certs_volume:
    driver: local
  elasticsearch_data_volume:
    driver: local
  elasticsearch_logs_volume:
    driver: local
  elasticsearch_plugins_volume:
    driver: local
  kibana_data_volume:
    driver: local
  grafana_volume:
    driver: local
  prometheus_volume:
    driver: local
  jaeger_volume:
    driver: local
  static_volume:
    driver: local
  www_volume:
    driver: local
